// ── Portfolio CRUD ────────────────────────────────────────────────
function savePortfolio() {
  localStorage.setItem('sb_portfolio_v2', JSON.stringify(portfolio));
}

function addHolding(ticker, shares, avgCost, thesis) {
  ticker = ticker.toUpperCase().trim();
  const existing = portfolio.find(h => h.ticker === ticker);
  if (existing) {
    existing.shares  = shares;
    existing.avgCost = avgCost;
    if (thesis) existing.thesis = thesis;
  } else {
    portfolio.push({
      id: Date.now().toString(),
      ticker, shares: parseFloat(shares), avgCost: parseFloat(avgCost),
      thesis: thesis || '',
      addedDate: new Date().toISOString().slice(0,10),
    });
  }
  savePortfolio();
}

function removeHolding(id) {
  portfolio = portfolio.filter(h => h.id !== id);
  savePortfolio();
  renderPortfolioIntelligence();
}

// ── Macro Alignment Scoring ───────────────────────────────────────
function scoreHoldingMacro(holding, stockData, macro) {
  const regime   = macro.regime   || 'NEUTRAL';
  const vix      = macro.vix      || 18;
  const usdChg   = macro.usd_chg  || 0;
  const tltChg   = macro.tlt_chg  || 0;
  const cpi      = macro.us_cpi   || 3;
  const spChg    = macro.sp_chg   || 0;
  const s        = stockData || {};
  const sector   = (s.sector || '').toLowerCase();
  const score    = s.score    || 50;
  const chgPct   = s.changePct || 0;
  const pe       = s.peRatio  || 0;
  const revG     = s.revenueGrowth || 0;
  const rangePos = s.week52High > 0
    ? ((s.price - s.week52Low) / (s.week52High - s.week52Low) * 100)
    : 50;

  const factors = {};
  const tailwinds = [];
  const headwinds = [];

  // 1. Regime fit (25%)
  const isTech       = sector.includes('tech') || sector.includes('communication');
  const isDefensive  = sector.includes('util') || sector.includes('consumer staple') || sector.includes('health');
  const isCommodity  = ['gld','slv','gdx','uso','gldm'].includes(holding.ticker.toLowerCase());
  const isBond       = ['tlt','ief','shy','bnd','tip','hyg','lqd'].includes(holding.ticker.toLowerCase());
  const isFinancial  = sector.includes('financ');

  if (isBond) {
    factors.regime = regime === 'RISK-OFF' ? 80 : regime === 'NEUTRAL' ? 55 : 30;
    if (regime === 'RISK-OFF') tailwinds.push('Risk-off regime — safe haven bid for bonds');
    if (regime === 'RISK-ON')  headwinds.push('Risk-on reduces bond demand');
  } else if (isCommodity) {
    factors.regime = regime === 'RISK-OFF' ? 75 : regime === 'NEUTRAL' ? 60 : 45;
    if (usdChg < -0.2) tailwinds.push('USD weakness — commodity tailwind');
    if (usdChg >  0.2) headwinds.push('USD strength — commodity headwind');
  } else if (isDefensive) {
    factors.regime = regime === 'RISK-OFF' ? 75 : regime === 'NEUTRAL' ? 65 : 45;
    if (regime === 'RISK-ON') headwinds.push('Risk-on rotates capital away from defensives');
  } else {
    // Growth/tech/cyclical — love risk-on
    factors.regime = regime === 'RISK-ON' ? 82 : regime === 'NEUTRAL' ? 55 : 25;
    if (regime === 'RISK-ON')  tailwinds.push('Risk-on regime favours growth assets');
    if (regime === 'RISK-OFF') headwinds.push('Risk-off — growth assets under pressure');
    if (regime === 'NEUTRAL' && vix > 20) headwinds.push(`VIX ${vix.toFixed(0)} — elevated uncertainty`);
  }

  // Ground the regime fit in the live engine's asset-class score when available
  const A = macro.assetScores || {};
  const engineFit = isBond      ? (A.BONDS       && A.BONDS.score)
                  : isCommodity ? (A.GOLD        && A.GOLD.score)
                  : (!isDefensive ? (A.US_EQUITIES && A.US_EQUITIES.score) : null);
  if (engineFit != null) {
    factors.regime = Math.round(0.6 * engineFit + 0.4 * factors.regime);
    if (engineFit >= 60)      tailwinds.push(`Engine rates this asset class ${Math.round(engineFit)}/100 — regime tailwind`);
    else if (engineFit <= 40) headwinds.push(`Engine rates this asset class ${Math.round(engineFit)}/100 — regime headwind`);
  }

  // 2. Rate sensitivity (20%)
  if (isBond) {
    factors.rates = tltChg > 0.2 ? 80 : tltChg < -0.2 ? 25 : 55;
    if (tltChg > 0.3)  tailwinds.push('Yields falling — bond rally');
    if (tltChg < -0.3) headwinds.push('Yields rising — bond price pressure');
  } else if (pe > 40) {
    factors.rates = tltChg > 0.2 ? 60 : tltChg < -0.3 ? 30 : 48;
    if (tltChg < -0.2) headwinds.push(`Very high P/E ${pe}x — vulnerable to yield rises`);
    if (tltChg >  0.2) tailwinds.push('Falling yields support high-multiple valuation');
  } else if (pe > 25 || isTech) {
    factors.rates = tltChg > 0.2 ? 68 : tltChg < -0.3 ? 42 : 58;
    if (tltChg < -0.3) headwinds.push(`Growth P/E ${pe}x — rate sensitive`);
  } else if (isFinancial) {
    factors.rates = tltChg < -0.2 ? 75 : tltChg > 0.2 ? 42 : 58;
    if (tltChg < -0.2) tailwinds.push('Rising yields expand bank margins');
  } else if (pe > 0 && pe < 15) {
    factors.rates = 65; // low PE value stocks less rate sensitive
    tailwinds.push(`Low P/E ${pe}x — limited rate sensitivity`);
  } else {
    factors.rates = 55;
  }

  // 3. USD sensitivity (15%)
  if (s.ticker && ['eem','vea','ewj','ezu','mchi'].includes(s.ticker.toLowerCase())) {
    factors.usd = usdChg < -0.2 ? 75 : usdChg > 0.2 ? 35 : 55;
    if (usdChg < -0.2) tailwinds.push('USD weakness boosts international returns');
    if (usdChg >  0.2) headwinds.push('USD strength hurts international holdings');
  } else if (isCommodity) {
    factors.usd = usdChg < -0.2 ? 75 : usdChg > 0.2 ? 35 : 55;
  } else {
    factors.usd = 58;
  }

  // 4. Inflation context (15%)
  if (isCommodity || holding.ticker.toLowerCase() === 'tip') {
    factors.inflation = cpi > 3.5 ? 78 : cpi > 2.5 ? 62 : 42;
    if (cpi > 4) tailwinds.push(`Inflation ${cpi}% — real asset tailwind`);
  } else if (isBond) {
    factors.inflation = cpi > 4 ? 28 : cpi > 3 ? 42 : 68;
    if (cpi > 4) headwinds.push(`High inflation ${cpi}% erodes bond real returns`);
  } else if (isDefensive) {
    factors.inflation = cpi > 3 ? 58 : 65;
  } else {
    factors.inflation = cpi > 5 ? 40 : cpi > 3.5 ? 52 : 65;
    if (cpi > 4.5) headwinds.push(`Elevated inflation ${cpi}% — margin pressure risk`);
  }

  // 5. Price momentum (15%)
  factors.momentum = chgPct > 2 ? 82 : chgPct > 0.5 ? 68 : chgPct > -0.5 ? 52 : chgPct > -2 ? 38 : 22;
  if (chgPct > 2)  tailwinds.push(`Strong momentum +${chgPct.toFixed(1)}% today`);
  if (chgPct < -2) headwinds.push(`Selling pressure ${chgPct.toFixed(1)}% today`);

  // 6. Valuation (10%)
  if (isBond || isCommodity) {
    factors.valuation = rangePos < 30 ? 75 : rangePos > 75 ? 38 : 58;
  } else {
    const fvGap = s.fairValue > 0 ? ((s.fairValue - s.price) / s.fairValue * 100) : 0;
    factors.valuation = fvGap > 15 ? 80 : fvGap > 5 ? 65 : fvGap > -5 ? 52 : fvGap > -15 ? 38 : 25;
    if (fvGap > 15)  tailwinds.push(`${fvGap.toFixed(0)}% below fair value — margin of safety`);
    if (fvGap < -20) headwinds.push(`${Math.abs(fvGap).toFixed(0)}% above fair value — limited upside`);
  }

  // Weighted composite
  const weights = { regime:0.25, rates:0.20, usd:0.15, inflation:0.15, momentum:0.15, valuation:0.10 };
  const composite = Math.round(
    Object.entries(weights).reduce((sum,[k,w]) => sum + (factors[k]||50)*w, 0)
  );

  // Thesis health
  let thesisHealth = 'Monitoring';
  let thesisNote   = '';
  if (holding.thesis) {
    const thesisLower = holding.thesis.toLowerCase();
    const isGrowthThesis = thesisLower.includes('growth') || thesisLower.includes('ai') || thesisLower.includes('revenue');
    const isValueThesis  = thesisLower.includes('value') || thesisLower.includes('cheap') || thesisLower.includes('undervalued');
    if (isGrowthThesis && revG > 15 && composite > 60) { thesisHealth = 'Intact'; thesisNote = `Revenue growing ${revG}% supports growth thesis`; }
    else if (isGrowthThesis && composite < 45)          { thesisHealth = 'Under Pressure'; thesisNote = 'Macro environment challenging for growth assets'; }
    else if (isValueThesis  && composite > 65)          { thesisHealth = 'Intact'; thesisNote = 'Value thesis supported by current macro'; }
    else                                                 { thesisHealth = 'Monitoring'; thesisNote = 'Continue monitoring macro alignment'; }
  }

  // Invalidation triggers
  const invalidators = [];
  if (isTech || pe > 25) invalidators.push('Fed signals rate hikes resume');
  if (revG > 20)         invalidators.push(`Revenue growth decelerates below ${Math.round(revG * 0.5)}%`);
  if (regime === 'RISK-ON' && !isBond) invalidators.push('VIX spikes above 25 — risk-off rotation');
  if (isBond)            invalidators.push('Inflation re-accelerates above 5%');
  if (isCommodity)       invalidators.push('USD strengthens sharply on Fed hawkishness');
  if (invalidators.length === 0) invalidators.push('Monitor for macro regime change');

  return { composite, factors, tailwinds: tailwinds.slice(0,3), headwinds: headwinds.slice(0,3), thesisHealth, thesisNote, invalidators: invalidators.slice(0,3) };
}

// ── Portfolio-level analysis ──────────────────────────────────────
function analysePortfolio(holdings, quotes, macro) {
  if (!holdings.length) return null;

  const totalValue = holdings.reduce((sum,h) => {
    const q = quotes.find(q => q.ticker === h.ticker);
    return sum + (q ? q.price * h.shares : h.avgCost * h.shares);
  }, 0);

  // Sector concentration
  const sectorMap = {};
  const themeMap  = { tech:0, defensive:0, commodity:0, bond:0, international:0 };
  const analyses  = [];

  holdings.forEach(h => {
    const q  = quotes.find(q => q.ticker === h.ticker) || {};
    const sd = stockCache[h.ticker] || q;
    const val = (q.price || h.avgCost) * h.shares;
    const pct = totalValue > 0 ? (val / totalValue * 100) : 0;
    const analysis = scoreHoldingMacro(h, sd, macro);

    const sector = (sd.sector || 'Other').split(' ')[0];
    sectorMap[sector] = (sectorMap[sector] || 0) + pct;

    // Theme tagging
    const sec = (sd.sector || '').toLowerCase();
    if (sec.includes('tech') || sec.includes('comm'))  themeMap.tech        += pct;
    if (sec.includes('util') || sec.includes('staple') || sec.includes('health')) themeMap.defensive += pct;
    if (['gld','slv','gdx','uso'].includes(h.ticker.toLowerCase())) themeMap.commodity += pct;
    if (['tlt','ief','shy','hyg'].includes(h.ticker.toLowerCase())) themeMap.bond      += pct;
    if (sec.includes('international') || ['eem','vea'].includes(h.ticker.toLowerCase())) themeMap.international += pct;

    analyses.push({
      holding: h, quote: q, stockData: sd,
      value: val, pct: Math.round(pct),
      pnl: q.price ? (q.price - h.avgCost) * h.shares : 0,
      pnlPct: q.price && h.avgCost > 0 ? ((q.price - h.avgCost) / h.avgCost * 100) : 0,
      ...analysis,
    });
  });

  analyses.sort((a,b) => b.composite - a.composite);

  // Portfolio macro fit
  const weightedScore = analyses.reduce((sum,a) => sum + a.composite * (a.pct/100), 0);
  let concentrationPenalty = 0;
  const topHolding = Math.max(...analyses.map(a => a.pct));
  if (topHolding > 40)  concentrationPenalty = 10;
  if (themeMap.tech > 60) concentrationPenalty += 8;
  const portfolioScore = Math.round(Math.min(100, Math.max(0, weightedScore - concentrationPenalty)));

  // Warnings
  const warnings = [];
  if (topHolding > 35)     warnings.push(`${analyses.find(a=>a.pct===topHolding)?.holding.ticker} is ${topHolding}% of portfolio — high concentration`);
  if (themeMap.tech > 55)  warnings.push(`Tech exposure ${Math.round(themeMap.tech)}% — elevated rate sensitivity`);
  if (themeMap.bond < 5 && macro.regime === 'RISK-OFF') warnings.push('No bond/defensive allocation in risk-off environment');

  // Missing exposures
  const missing = [];
  const regime = macro.regime || 'NEUTRAL';
  if (themeMap.commodity < 5 && macro.usd_chg < -0.1) missing.push('Commodity/gold — USD weakness tailwind uncaptured');
  if (themeMap.international < 5)  missing.push('International diversification — home bias detected');
  if (themeMap.defensive < 10 && regime !== 'RISK-ON') missing.push('Defensive allocation — consider for regime protection');

  return {
    analyses,
    portfolioScore,
    totalValue,
    totalPnl: analyses.reduce((s,a) => s+a.pnl, 0),
    highestConviction: analyses[0],
    weakestAlignment:  analyses[analyses.length-1],
    warnings,
    missing,
    themeMap,
    sectorMap,
  };
}

// ── Translate the regime engine snapshot into portfolio macro context ──
// Maps the 5-pillar engine output into the fields analysePortfolio/
// scoreHoldingMacro read. Falls back gracefully if the engine is unavailable.
function buildPortfolioMacro(rie, prices) {
  const px  = prices || {};
  const chg = o => (o && typeof o === 'object') ? (o.changePct || 0) : 0;
  const base = {
    vix:     (px.vix && px.vix.price) || 18,
    usd_chg: chg(px.dxy),
    tlt_chg: -chg(px.bonds10),   // bonds10 is now the 10Y YIELD (^TNX): rising yield = falling bond price
    sp_chg:  chg(px.sp500),
  };
  if (!rie || rie.regime_score == null) {
    return { ...base, regime: 'NEUTRAL', regimeScore: null, regimeLabel: 'Unknown',
             engineLive: false, assetScores: {} };
  }
  const score = rie.regime_score;
  const regime = score >= 57 ? 'RISK-ON' : score < 44 ? 'RISK-OFF' : 'NEUTRAL';
  return {
    ...base,
    regime,
    regimeScore: score,
    regimeLabel: rie.regime_label || '',
    confidence:  rie.confidence,
    trend:       rie.regime_trend,
    engineLive:  true,
    assetScores: rie.asset_scores || {},
  };
}

    <div style="background:#0a0d12;border:1px solid #1e2530;border-radius:10px;padding:16px;transition:border-color .15s"

            <div style="font-size:11px;color:${pnlCol(a.pnl)}">${a.pnl >= 0 ? '+' : ''}${portSym()}${Math.abs(portFx(a.pnl)).toLocaleString('en',{maximumFractionDigits:0})} (${a.pnlPct.toFixed(1)}%)</div>

          ${a.holding.thesis ? `<div style="font-size:10px;color:${thCol(a.thesisHealth)};background:${thCol(a.thesisHealth)}18;border:1px solid ${thCol(a.thesisHealth)}33;padding:2px 8px;border-radius:4px;font-family:'IBM Plex Mono',monospace">${a.thesisHealth}</div>` : ''}

      <!-- Score bar -->
      <div style="height:6px;background:#080c12;border-radius:3px;position:relative;margin-bottom:12px;overflow:hidden">
        <div style="position:absolute;left:50%;top:0;width:1px;height:100%;background:#1e2530"></div>
        <div style="position:absolute;top:0;height:100%;left:${barLeft}%;width:${barPct}%;background:${scoreCol(a.composite)};border-radius:2px;opacity:.8"></div>

function submitCashForm() {
  const amount = parseFloat(document.getElementById('cash_amount').value);
  const label  = document.getElementById('cash_label').value.trim();
  if (isNaN(amount) || amount < 0) return;
  // Remove existing cash entry
  portfolio = portfolio.filter(h => h.ticker !== 'CASH');
  if (amount > 0) {
    portfolio.push({
      id: 'cash-' + Date.now(),
      ticker: 'CASH', shares: 1, avgCost: amount,
      thesis: label || 'Uninvested cash / dry powder',
      addedDate: new Date().toISOString().slice(0,10),
      isCash: true,
    });
  }
  savePortfolio();
  document.getElementById('cashFormOverlay').remove();
  renderPortfolioIntelligence();
}

// Override analysePortfolio to handle cash
const _origAnalyse = analysePortfolio;
function analysePortfolio(holdings, quotes, macro) {
  // Separate cash from equities
  const cashHolding = holdings.find(h => h.ticker === 'CASH' || h.isCash);
  const equities    = holdings.filter(h => h.ticker !== 'CASH' && !h.isCash);

  const result = equities.length ? _origAnalyse(equities, quotes, macro) : {
    analyses: [], portfolioScore: 0, totalValue: 0, totalPnl: 0,
    highestConviction: null, weakestAlignment: null, warnings: [], missing: [], themeMap: {}
  };

  if (cashHolding) {
    const cashVal  = cashHolding.avgCost;
    const cashPct  = (cashVal / (result.totalValue + cashVal)) * 100;
    result.totalValue += cashVal;
    result.cashValue   = cashVal;
    result.cashPct     = Math.round(cashPct);
    result.cashLabel   = cashHolding.thesis;
    result.cashId      = cashHolding.id;

    // Cash macro context
    const regime = (macro && macro.regime) || 'NEUTRAL';
    if (cashPct > 30 && regime === 'RISK-ON')
      result.warnings.push(`${Math.round(cashPct)}% in cash — significant dry powder in risk-on market`);
    if (cashPct < 5 && regime === 'RISK-OFF')
      result.warnings.push('Low cash allocation — consider defensive positioning in risk-off');
  }

  return result;
}

const SCORECARD_TICKERS = new Set([
  'SPY','QQQ','DIA','IWM','EWU','EZU','EWJ','MCHI','EEM',
  'GLD','SLV','GDX','USO','UNG','CPER',
  'TLT','IEF','SHY','HYG','TIP',
  'UUP','FXE','FXB','FXY','FXA','FXF'
]);

let _openScorecard = null;  // currently expanded ticker

async function toggleScorecard(ticker, rowEl) {
  // Close if already open
  const existing = document.getElementById('sc_' + ticker);
  if (existing) {
    existing.remove();
    _openScorecard = null;
    rowEl.style.borderLeftWidth = '2px';
    return;
  }

  // Close any other open scorecard
  if (_openScorecard) {
    const prev = document.getElementById('sc_' + _openScorecard);
    if (prev) prev.remove();
    const prevRow = document.getElementById('scrow_' + _openScorecard);
    if (prevRow) prevRow.style.borderLeftWidth = '2px';
  }
  _openScorecard = ticker;
  rowEl.style.borderLeftWidth = '3px';

  // Insert loading placeholder after the row
  const placeholder = document.createElement('div');
  placeholder.id = 'sc_' + ticker;
  placeholder.style.cssText = 'padding:20px;text-align:center;color:#4a5568;font-size:12px;font-family:IBM Plex Mono,monospace;background:#080c12;border-left:3px solid #2a3441;border-bottom:1px solid #1e2530';
  placeholder.textContent = 'Loading scorecard...';
  rowEl.insertAdjacentElement('afterend', placeholder);

  const card = await apiFetch('/api/scorecard/' + ticker, null);
  if (!card) {
    placeholder.textContent = 'Scorecard unavailable for this asset';
    return;
  }

  placeholder.innerHTML = scorecardDetailHTML(
    card,
    `toggleScorecard('${ticker}', document.getElementById('scrow_${ticker}'))`
  );
}

// Shared EdgeFinder scorecard detail panel — used by the Asset Scanner
// (inline expand) and the Top Setups matrix (row expand).
function scorecardDetailHTML(card, closeAction) {
  const overallCol = o =>
    o === 'Very Bullish' ? '#48d597' :
    o === 'Bullish'      ? '#7ed4a4' :
    o === 'Bearish'      ? '#f56565' :
    o === 'Very Bearish' ? '#c53030' : '#f6c90e';

  const FAC = [
    ['growth','Growth'], ['inflation','Inflation'], ['real_yields','Real Yields'],
    ['liquidity','Liquidity'], ['usd','USD'], ['momentum','Momentum'],
  ];
  const favCol = f => f >= 57 ? '#48d597' : f <= 43 ? '#f56565' : '#f6c90e';

  const facRow = ([k,lbl]) => {
    const g = card[k] || {};
    const fav = (g.score==null) ? 50 : g.score;
    const notes = (g.factors||[]).map(n=>`${n.label} ${n.value}`).join('  ·  ');
    const wpct = g.weight||0;
    return `
      <tr style="border-bottom:1px solid #1e253033">
        <td style="padding:7px 10px;font-size:11px;color:#a0aec0">${lbl}</td>
        <td style="padding:7px 10px;font-size:11px;color:#718096;font-family:'IBM Plex Mono',monospace">${wpct}%</td>
        <td style="padding:7px 10px"><span style="color:${favCol(fav)};font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700">${fav}</span><span style="color:#2a3441;font-size:10px">/100</span></td>
        <td style="padding:7px 10px;font-size:11px;color:#e2e8f0;font-family:'IBM Plex Mono',monospace">${(g.points!=null?g.points:0)}</td>
        <td style="padding:7px 10px;font-size:10px;color:#4a5568;font-family:'IBM Plex Mono',monospace">${notes||'—'}</td>
      </tr>`;
  };

  const c       = card.composite;                 // 0-100
  const barPct  = Math.abs(c-50)/50*45;
  const barLeft = c >= 50 ? 50 : 50 - barPct;
  const col     = overallCol(card.overall);

  // ── Stage 1: tailwinds / headwinds + self-explanation (pure derivation) ──
  // Contribution to the bias = weight × (favour − 50): how far each factor pushed
  // the score off neutral, accounting for BOTH its reading and its weight here.
  const FACS = [['growth','Growth'],['inflation','Inflation'],['real_yields','Real Yields'],
                ['liquidity','Liquidity'],['usd','USD'],['momentum','Momentum']];
  const PHRASE = {
    growth:      ['weak growth','steady growth','firm growth'],
    inflation:   ['cooling inflation','moderate inflation','hot inflation'],
    real_yields: ['low real yields','middling real yields','elevated real yields'],
    liquidity:   ['tight liquidity','neutral liquidity','ample liquidity'],
    usd:         ['a soft dollar','a steady dollar','a firm dollar'],
    momentum:    ['weak momentum','flat momentum','strong momentum'],
  };
  const contribs = FACS.map(([k,lbl])=>{
    const g = card[k]||{}; const fav = (g.score==null?50:g.score);
    const w = g.weight||0; const raw = (g.raw==null?50:g.raw);
    return {k, lbl, fav, w, raw, contrib:+(w/100*(fav-50)).toFixed(1)};
  }).filter(x=>x.w>0);
  const tail = contribs.filter(x=>x.contrib>0.3).sort((a,b)=>b.contrib-a.contrib);
  const head = contribs.filter(x=>x.contrib<-0.3).sort((a,b)=>a.contrib-b.contrib);
  const phr  = x => PHRASE[x.k][ x.raw>=60?2 : x.raw<=40?0 : 1 ];
  const cap  = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;
  const jp   = a => a.length===0?'' : a.length===1?a[0] : a.length===2?`${a[0]} and ${a[1]}`:`${a[0]}, ${a[1]} and ${a[2]}`;
  const headTxt = jp(head.slice(0,3).map(phr));
  const tailTxt = jp(tail.slice(0,2).map(phr));
  let explainTxt;
  if (c <= 43) {
    explainTxt = `${card.name} scores ${c}/100 (${card.overall}): ${headTxt||'no single factor'} ${head.length>1?'are':'is'} the main drag${head.length>1?'s':''}.`;
    if (tail.length) explainTxt += ` ${cap(tailTxt)} offer${tail.length>1?'':'s'} some support, but not enough to offset the headwinds.`;
  } else if (c >= 57) {
    explainTxt = `${card.name} scores ${c}/100 (${card.overall}): ${tailTxt||'broad factor support'} ${tail.length>1?'are':'is'} driving it.`;
    if (head.length) explainTxt += ` ${cap(headTxt)} weigh${head.length>1?'':'s'} against, but ${head.length>1?"don't":"doesn't"} dominate.`;
  } else {
    const sup = tail.length ? `${cap(tailTxt)} support${tail.length>1?'':'s'} it` : 'little supports it';
    const wgh = head.length ? `${headTxt} weigh${head.length>1?'':'s'} against`   : 'little weighs against';
    explainTxt = `${card.name} scores ${c}/100 (Neutral): ${sup}, while ${wgh} — the two roughly offset.`;
  }
  const twRow = x => `
    <div style="display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid #1e253022">
      <div style="flex:1;font-size:11px;color:#a0aec0">${x.lbl}<span style="color:#4a5568;font-size:10px"> · ${phr(x)}</span></div>
      <div style="font-size:11px;font-weight:700;font-family:'IBM Plex Mono',monospace;color:${x.contrib>0?'#48d597':'#f56565'}">${x.contrib>0?'+':''}${x.contrib}</div>
    </div>`;
  const twCol = (title,list,clr)=>`
    <div style="background:#0a0f16;border:1px solid #1e2530;border-radius:6px;padding:10px 12px">
      <div style="font-size:9px;color:${clr};font-family:'IBM Plex Mono',monospace;letter-spacing:.5px;margin-bottom:6px">${title}</div>
      ${list.length? list.slice(0,3).map(twRow).join('') : '<div style="font-size:11px;color:#2a3441;padding:4px 0">None significant</div>'}
    </div>`;

  return `
    <div style="padding:16px 20px;background:#080c12;border-left:3px solid ${col};border-bottom:1px solid #1e2530">

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">
        <div style="display:flex;align-items:center;gap:16px">
          <div>
            <div style="font-size:11px;color:#4a5568;font-family:'IBM Plex Mono',monospace;margin-bottom:2px">${card.ticker} · ${card.name}${card.asset_class?` · <span style="color:#2a3441">${card.asset_class}</span>`:''}</div>
            <div style="font-size:18px;font-weight:700;color:${col}">${card.overall}</div>
          </div>
          <div style="text-align:center;background:#0d1117;border:1px solid ${col}44;border-radius:8px;padding:8px 16px">
            <div style="font-size:10px;color:#4a5568;font-family:'IBM Plex Mono',monospace">SCORE</div>
            <div style="font-size:26px;font-weight:700;color:${col};font-family:'IBM Plex Mono',monospace;line-height:1">${c}<span style="font-size:12px;color:#2a3441">/100</span></div>
          </div>
        </div>
        <div style="min-width:200px">
          <div style="display:flex;justify-content:space-between;font-size:9px;color:#2a3441;font-family:'IBM Plex Mono',monospace;margin-bottom:4px">
            <span>0 BEARISH</span><span>50</span><span>BULLISH 100</span>
          </div>
          <div style="height:12px;background:#0d1117;border-radius:6px;position:relative;overflow:hidden;border:1px solid #1e2530">
            <div style="position:absolute;left:50%;top:0;width:1px;height:100%;background:#2a3441"></div>
            <div style="position:absolute;top:1px;height:10px;left:${barLeft}%;width:${barPct}%;background:${col};border-radius:4px;opacity:.85"></div>
          </div>
        </div>
      </div>

      <!-- Why this score -->
      <div style="background:#0a0f16;border:1px solid #1e2530;border-left:2px solid ${col};border-radius:6px;padding:11px 14px;margin-bottom:12px">
        <div style="font-size:9px;color:#2a3441;font-family:'IBM Plex Mono',monospace;letter-spacing:.5px;margin-bottom:5px">WHY THIS SCORE</div>
        <div style="font-size:13px;color:#cbd5e0;line-height:1.55">${explainTxt}</div>
      </div>

      <!-- Tailwinds / Headwinds -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px">
        ${twCol('▲ BIGGEST TAILWINDS', tail, '#48d597')}
        ${twCol('▼ BIGGEST HEADWINDS', head, '#f56565')}
      </div>
      <div style="font-size:9px;color:#2a3441;text-align:right;margin-bottom:14px">Contribution to score vs neutral (50), in points</div>

      <!-- Weighted decomposition -->
      <table style="width:100%;border-collapse:collapse;background:#080c12;border-radius:6px;overflow:hidden">
        <thead>
          <tr style="border-bottom:1px solid #1e2530">
            <th style="padding:6px 10px;text-align:left;font-size:9px;color:#2a3441;font-family:'IBM Plex Mono',monospace;letter-spacing:.5px">FACTOR</th>
            <th style="padding:6px 10px;text-align:left;font-size:9px;color:#2a3441;font-family:'IBM Plex Mono',monospace;letter-spacing:.5px">WEIGHT</th>
            <th style="padding:6px 10px;text-align:left;font-size:9px;color:#2a3441;font-family:'IBM Plex Mono',monospace;letter-spacing:.5px">FAVOUR</th>
            <th style="padding:6px 10px;text-align:left;font-size:9px;color:#2a3441;font-family:'IBM Plex Mono',monospace;letter-spacing:.5px">POINTS</th>
            <th style="padding:6px 10px;text-align:left;font-size:9px;color:#2a3441;font-family:'IBM Plex Mono',monospace;letter-spacing:.5px">UNDERLYING READINGS</th>
          </tr>
        </thead>
        <tbody>${FAC.map(facRow).join('')}</tbody>
      </table>

      <div style="margin-top:12px;font-size:10px;color:#2a3441;text-align:right">
        Score = Σ (weight × favour), weighted for ${card.asset_class||'asset'} sensitivity · Favour is 0-100 for this asset · Not financial advice
        ${closeAction ? `<span style="margin-left:12px;cursor:pointer;color:#4a5568" onclick="${closeAction}">▲ Close</span>` : ''}
      </div>
    </div>`;
}

let _setupsData = null;
let _setupsView = 'grouped';      // 'grouped' | 'ranked'
let _openSetup  = null;           // currently expanded ticker

const SETUP_BIAS = {
  Bullish: { col:'#48d597', bg:'#0d2820' },
  Bearish: { col:'#f56565', bg:'#2a0a0a' },
  Neutral: { col:'#f6c90e', bg:'#14110044' },
};
function setupOverallCol(o){
  return o==='Very Bullish'?'#48d597':o==='Bullish'?'#7ed4a4':
         o==='Bearish'?'#f56565':o==='Very Bearish'?'#c53030':'#f6c90e';
}

async function renderSetups() {
  const el = document.getElementById('mainContent');
  showSpinner('Building setups matrix…');
  const data = await apiFetch('/api/setups', null);
  if (!data || !data.count) { showErr('Setups matrix unavailable'); return; }
  _setupsData = data;
  _openSetup  = null;
  paintSetups();
}

function setSetupsView(v){ _setupsView = v; _openSetup = null; paintSetups(); }

async function refreshSetups(){
  const el = document.getElementById('mainContent');
  showSpinner('Refreshing setups…');
  await apiFetch('/api/setups/refresh', {});
  await renderSetups();
}

function setupCell(cell){
  // One factor cell: 0-100 favourability for this asset, coloured by bias
  const b   = SETUP_BIAS[cell.bias] || SETUP_BIAS.Neutral;
  const txt = (cell.score==null) ? '·' : cell.score;
  return `<td style="padding:4px;text-align:center">
    <div title="${cell.bias} · favour ${cell.score}/100 · weight ${cell.weight||0}%" style="background:${b.bg};border:1px solid ${b.col}55;border-radius:4px;padding:5px 0;min-width:42px">
      <div style="font-size:12px;font-weight:700;color:${b.col};font-family:'IBM Plex Mono',monospace;line-height:1">${txt}</div>
    </div></td>`;
}

function setupRow(r, cols){
  const col   = setupOverallCol(r.overall);
  const c     = r.composite;                       // 0-100
  const dev   = c - 50;
  const barPct= Math.abs(dev)/50*45, barLeft = c>=50?50:50-barPct;
  const chg   = r.changePct||0;
  const chgCol= chg>0?'#48d597':chg<0?'#f56565':'#718096';
  return `
    <tr id="sr_${r.ticker}" onclick="toggleSetupDetail('${r.ticker}')"
        style="border-bottom:1px solid #1e253033;cursor:pointer;border-left:2px solid ${col}"
        onmouseover="this.style.background='#0d111766'" onmouseout="this.style.background='transparent'">
      <td style="padding:7px 10px;white-space:nowrap">
        <span style="font-size:12px;font-weight:600;color:#e2e8f0;font-family:'IBM Plex Mono',monospace">${r.ticker}</span>
        <span style="font-size:10px;color:#4a5568;margin-left:6px">${r.name}</span>
      </td>
      <td style="padding:7px 8px;text-align:right;font-size:11px;color:${chgCol};font-family:'IBM Plex Mono',monospace;white-space:nowrap">${chg>0?'+':''}${chg.toFixed(2)}%</td>
      ${cols.map(co=>setupCell(r.cells[co.key]||{bias:'Neutral',score:null,weight:0})).join('')}
      <td style="padding:7px 10px;text-align:center">
        <div style="font-size:15px;font-weight:700;color:${col};font-family:'IBM Plex Mono',monospace;line-height:1">${c}</div>
        <div style="height:5px;width:64px;background:#0d1117;border:1px solid #1e2530;border-radius:3px;position:relative;margin:3px auto 0;overflow:hidden">
          <div style="position:absolute;left:50%;top:0;width:1px;height:100%;background:#2a3441"></div>
          <div style="position:absolute;top:0;height:100%;left:${barLeft}%;width:${barPct}%;background:${col};opacity:.85"></div>
        </div>
      </td>
      <td style="padding:7px 10px;white-space:nowrap;font-size:11px;font-weight:600;color:${col}">${r.overall}</td>
    </tr>`;
}

function setupTable(rows, cols){
  const th = (l,extra='')=>`<th style="padding:7px 8px;font-size:9px;color:#2a3441;font-family:'IBM Plex Mono',monospace;letter-spacing:.5px;${extra}">${l}</th>`;
  return `
    <div style="overflow-x:auto;border:1px solid #1e2530;border-radius:8px;background:#080c12">
      <table style="width:100%;border-collapse:collapse;min-width:720px">
        <thead><tr style="border-bottom:1px solid #1e2530">
          ${th('ASSET','text-align:left')}
          ${th('1D','text-align:right')}
          ${cols.map(co=>th(co.label+(co.scored?'':' ✦'),'text-align:center')).join('')}
          ${th('SCORE','text-align:center')}
          ${th('BIAS','text-align:left')}
        </tr></thead>
        <tbody>${rows.map(r=>setupRow(r,cols)).join('')}</tbody>
      </table>
    </div>`;
}

function paintSetups(){
  const el = document.getElementById('mainContent');
  const data = _setupsData; if (!data) return;
  const cols = data.columns;

  const chip = r => {
    const col = setupOverallCol(r.overall);
    return `<span onclick="toggleSetupDetail('${r.ticker}')" style="display:inline-flex;align-items:center;gap:6px;background:#0d1117;border:1px solid ${col}44;border-radius:5px;padding:4px 9px;cursor:pointer;margin:0 5px 5px 0">
      <span style="font-size:11px;font-weight:600;color:#e2e8f0;font-family:'IBM Plex Mono',monospace">${r.ticker}</span>
      <span style="font-size:12px;font-weight:700;color:${col};font-family:'IBM Plex Mono',monospace">${r.composite>0?'+':''}${r.composite}</span>
    </span>`;
  };

  const body = _setupsView==='grouped'
    ? data.grouped.map(g=>`
        <div style="margin-bottom:16px">
          <div style="font-size:10px;color:#718096;font-family:'IBM Plex Mono',monospace;letter-spacing:1.5px;margin-bottom:7px">${g.label.toUpperCase()} · ${g.assets.length}</div>
          ${setupTable(g.assets, cols)}
        </div>`).join('')
    : `<div style="margin-bottom:16px">
         <div style="font-size:10px;color:#718096;font-family:'IBM Plex Mono',monospace;letter-spacing:1.5px;margin-bottom:7px">RANKED BY CONVICTION · ${data.ranked.length}</div>
         ${setupTable(data.ranked, cols)}
       </div>`;

  const tabBtn = (v,l)=>`<button onclick="setSetupsView('${v}')" style="font-size:10px;font-family:'IBM Plex Mono',monospace;padding:4px 11px;border-radius:4px;cursor:pointer;border:1px solid ${_setupsView===v?'#48d597':'#1e2530'};background:${_setupsView===v?'#0d2820':'#080c12'};color:${_setupsView===v?'#48d597':'#4a5568'}">${l}</button>`;

  el.innerHTML = `
    <!-- Context bar -->
    <div style="background:#080c12;border:1px solid #1e2530;border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:10px;color:#48d597;font-family:'IBM Plex Mono',monospace;font-weight:700">MARKETS</span>
        <span style="font-size:10px;color:#2a3441">›</span>
        <span style="font-size:10px;color:#718096;font-family:'IBM Plex Mono',monospace">Top Setups</span>
      </div>
      <div style="font-size:11px;color:#4a5568">${data.count} assets · macro factor bias · EdgeFinder-style</div>
      <div style="display:flex;gap:6px;align-items:center">
        ${tabBtn('grouped','By Class')}
        ${tabBtn('ranked','By Conviction')}
        <button onclick="refreshSetups()" style="font-size:10px;color:#4a5568;background:none;border:1px solid #1e2530;padding:4px 10px;border-radius:4px;cursor:pointer" onmouseover="this.style.color='#48d597'" onmouseout="this.style.color='#4a5568'">↻ Refresh</button>
      </div>
    </div>

    <!-- Hero strip -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
      <div style="background:#080c12;border:1px solid #0d2820;border-radius:8px;padding:12px 14px">
        <div style="font-size:9px;color:#48d597;font-family:'IBM Plex Mono',monospace;letter-spacing:1px;margin-bottom:8px">▲ STRONGEST BULLISH</div>
        <div>${(data.top_bullish||[]).length?data.top_bullish.map(chip).join(''):'<span style="font-size:11px;color:#4a5568">No bullish setups ≥ +2 right now</span>'}</div>
      </div>
      <div style="background:#080c12;border:1px solid #2a0a0a;border-radius:8px;padding:12px 14px">
        <div style="font-size:9px;color:#f56565;font-family:'IBM Plex Mono',monospace;letter-spacing:1px;margin-bottom:8px">▼ STRONGEST BEARISH</div>
        <div>${(data.top_bearish||[]).length?data.top_bearish.map(chip).join(''):'<span style="font-size:11px;color:#4a5568">No bearish setups ≤ −2 right now</span>'}</div>
      </div>
    </div>

    <!-- Matrix -->
    <div id="setupsBody">${body}</div>

    <!-- Detail mount -->
    <div id="setupDetail" style="margin-top:12px"></div>

    <!-- Legend -->
    <div style="margin-top:14px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:10px;color:#4a5568;font-family:'IBM Plex Mono',monospace">
      <span><span style="display:inline-block;width:10px;height:10px;background:#0d2820;border:1px solid #48d59555;border-radius:2px;vertical-align:middle"></span> Bullish</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:#1a1500;border:1px solid #f6c90e55;border-radius:2px;vertical-align:middle"></span> Neutral</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:#2a0a0a;border:1px solid #f5656555;border-radius:2px;vertical-align:middle"></span> Bearish</span>
      <span style="color:#2a3441">✦ Technical = context only, excluded from composite score · Click any row for the full factor breakdown · Not financial advice</span>
    </div>`;
}

async function toggleSetupDetail(ticker){
  const row = document.getElementById('sr_' + ticker);
  if (!row) return;

  // Toggle off if this asset is already open
  if (_openSetup === ticker){
    const open = document.getElementById('sd_' + ticker);
    if (open) open.remove();
    _openSetup = null;
    row.style.borderLeftWidth = '2px';
    return;
  }
  // Collapse any other open detail
  if (_openSetup){
    const prevDetail = document.getElementById('sd_' + _openSetup);
    if (prevDetail) prevDetail.remove();
    const prevRow = document.getElementById('sr_' + _openSetup);
    if (prevRow) prevRow.style.borderLeftWidth = '2px';
  }
  _openSetup = ticker;
  row.style.borderLeftWidth = '4px';

  // Insert an expanding detail row directly beneath the clicked asset
  const cols = row.children.length || 10;
  const tr   = document.createElement('tr');
  tr.id = 'sd_' + ticker;
  tr.innerHTML = `<td colspan="${cols}" style="padding:0;background:#080c12">
    <div style="padding:16px;text-align:center;color:#4a5568;font-size:12px;font-family:'IBM Plex Mono',monospace">Loading ${ticker} scorecard…</div></td>`;
  row.insertAdjacentElement('afterend', tr);
  row.scrollIntoView({behavior:'smooth', block:'nearest'});

  const card = await apiFetch('/api/scorecard/' + ticker, null);
  const cell = document.querySelector('#sd_' + ticker + ' > td');
  if (!cell) return;  // user collapsed/switched while loading
  if (!card){ cell.innerHTML = `<div style="padding:14px;color:#f56565;font-size:11px">Scorecard unavailable for ${ticker}</div>`; return; }
  cell.innerHTML = scorecardDetailHTML(card, `toggleSetupDetail('${ticker}')`);
}

// ◈ ASSET DASHBOARD — intelligence-first exploration by asset class
// "What is strongest / weakest in the current regime?"
// ══════════════════════════════════════════════════════════════════
let _dashData = null, _dashClass = null, _openDashAsset = null;

function dashScoreCol(s){ return s>=60?'#48d597':s<=40?'#f56565':'#f6c90e'; }
function dashFitCol(f){ return f==='Strong'?'#48d597':f==='Weak'?'#f56565':'#f6c90e'; }
function dashTrendBadge(t){
  const c = t==='Improving'?'#48d597':t==='Deteriorating'?'#f56565':'#718096';
  const i = t==='Improving'?'▲':t==='Deteriorating'?'▼':'■';
  return `<span style="color:${c};font-size:10px;font-family:'IBM Plex Mono',monospace;white-space:nowrap">${i} ${t}</span>`;
}

async function renderAssetDashboard(){
  const el = document.getElementById('mainContent');
  showSpinner('Loading asset dashboard...');
  const data = await apiFetch('/api/dashboard', null);
  if (!data || !data.classes){ showErr('Asset dashboard unavailable'); return; }
  _dashData = data;
  if (!_dashClass || !data.classes.find(c=>c.key===_dashClass && c.available)){
    const first = data.classes.find(c=>c.available);
    _dashClass = first ? first.key : 'index';
  }
  _openDashAsset = null;
  paintDashboard();
}

function setDashClass(k){ _dashClass = k; _openDashAsset = null; paintDashboard(); }

async function refreshDashboard(){
  showSpinner('Refreshing dashboard...');
  await apiFetch('/api/dashboard/refresh', {});
  await renderAssetDashboard();
}

function dashMiniChip(a){
  const c = dashScoreCol(a.score);
  return `<span onclick="toggleDashAsset('${a.ticker}')" style="display:inline-flex;align-items:center;gap:6px;background:#0d1117;border:1px solid ${c}44;border-radius:5px;padding:4px 9px;cursor:pointer;margin:0 5px 5px 0">
    <span style="font-size:11px;font-weight:600;color:#e2e8f0;font-family:'IBM Plex Mono',monospace">${a.ticker}</span>
    <span style="font-size:12px;font-weight:700;color:${c};font-family:'IBM Plex Mono',monospace">${a.score}</span>
  </span>`;
}

function paintDashboard(){
  const el = document.getElementById('mainContent');
  const data = _dashData;
  const cls = data.classes.find(c=>c.key===_dashClass) || {};

  const dropdown = `<select onchange="setDashClass(this.value)" style="background:#0d1117;border:1px solid #1e2530;color:#e2e8f0;font-size:13px;font-family:'IBM Plex Mono',monospace;padding:7px 12px;border-radius:6px;cursor:pointer;outline:none">
    ${data.classes.map(c=>`<option value="${c.key}" ${c.key===_dashClass?'selected':''} ${c.available?'':'disabled'}>${c.label}${c.available?'':' — soon'}</option>`).join('')}
  </select>`;

  const head = `
    <div style="background:#080c12;border:1px solid #1e2530;border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:10px;color:#48d597;font-family:'IBM Plex Mono',monospace;font-weight:700">MARKET DATA</span>
        <span style="font-size:10px;color:#2a3441">›</span>
        <span style="font-size:10px;color:#718096;font-family:'IBM Plex Mono',monospace">Asset Dashboard</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span style="font-size:11px;color:#4a5568">Regime: <span style="color:#a0aec0">${data.regime_label} ${data.regime_score}</span> · scores inherit engine trend &amp; confidence</span>
        ${dropdown}
        <button onclick="refreshDashboard()" style="font-size:10px;color:#4a5568;background:none;border:1px solid #1e2530;padding:6px 10px;border-radius:4px;cursor:pointer" onmouseover="this.style.color='#48d597'" onmouseout="this.style.color='#4a5568'">↻</button>
      </div>
    </div>`;

  if (!cls.available){
    el.innerHTML = head + `<div style="background:#080c12;border:1px solid #1e2530;border-radius:10px;padding:48px;text-align:center">
      <div style="font-size:34px;margin-bottom:10px">🪙</div>
      <div style="font-size:15px;color:#e2e8f0;margin-bottom:6px">${cls.label||'This asset class'} — coming soon</div>

  // Class intelligence summary
  const summary = `
    <div style="display:grid;grid-template-columns:auto 1fr 1fr;gap:12px;margin-bottom:14px">

        <div style="font-size:9px;color:#4a5568;font-family:'IBM Plex Mono',monospace;letter-spacing:1.5px;margin-bottom:4px">AVG REGIME SCORE</div>
        <div style="font-size:46px;font-weight:700;color:${dashScoreCol(cls.avg_score)};font-family:'IBM Plex Mono',monospace;line-height:1">${cls.avg_score}</div>
        <div style="margin-top:6px">${dashTrendBadge(cls.trend)} · <span style="font-size:10px;color:${dashFitCol(cls.avg_fit)}">${cls.avg_fit}</span></div>
      </div>
      <div style="background:#080c12;border:1px solid #0d2820;border-radius:10px;padding:14px 16px">
        <div style="font-size:9px;color:#48d597;font-family:'IBM Plex Mono',monospace;letter-spacing:1px;margin-bottom:9px">▲ STRONGEST</div>
        <div>${cls.strongest.map(s=>dashMiniChip({ticker:s.ticker,score:s.score})).join('')}</div>
      </div>
      <div style="background:#080c12;border:1px solid #2a0a0a;border-radius:10px;padding:14px 16px">
        <div style="font-size:9px;color:#f56565;font-family:'IBM Plex Mono',monospace;letter-spacing:1px;margin-bottom:9px">▼ WEAKEST</div>
        <div>${cls.weakest.map(s=>dashMiniChip({ticker:s.ticker,score:s.score})).join('')}</div>

  // Per-asset table
  const th = (l,a='left')=>`<th style="padding:8px 10px;text-align:${a};font-size:9px;color:#2a3441;font-family:'IBM Plex Mono',monospace;letter-spacing:.5px">${l}</th>`;

      <td style="padding:9px 10px;white-space:nowrap"><span style="font-size:12px;font-weight:600;color:#e2e8f0;font-family:'IBM Plex Mono',monospace">${a.ticker}</span><span style="font-size:10px;color:#4a5568;margin-left:7px">${a.name}</span></td>
      <td style="padding:9px 10px;text-align:right;font-size:11px;color:${chgCol};font-family:'IBM Plex Mono',monospace">${chg>0?'+':''}${chg.toFixed(2)}%</td>
      <td style="padding:9px 10px;text-align:center"><span style="font-size:17px;font-weight:700;color:${sc};font-family:'IBM Plex Mono',monospace">${a.score}</span></td>
      <td style="padding:9px 10px;text-align:center;font-size:11px;color:${a.confidence>=75?'#48d597':a.confidence>=55?'#f6c90e':'#f56565'};font-family:'IBM Plex Mono',monospace">${a.confidence}%</td>
      <td style="padding:9px 10px;text-align:center">${dashTrendBadge(a.trend)}</td>
      <td style="padding:9px 10px;text-align:center;font-size:11px;font-weight:600;color:${dashFitCol(a.regime_fit)}">${a.regime_fit}</td>

  const table = `
    <div style="background:#080c12;border:1px solid #1e2530;border-radius:8px;overflow:hidden">
      <div style="padding:12px 14px;border-bottom:1px solid #1e2530;display:flex;align-items:center;justify-content:space-between">

  el.innerHTML = head + summary + table;

async function toggleDashAsset(ticker){
  const mount = document.getElementById('dashDetail');
  const row   = document.getElementById('dr_' + ticker);
  if (!mount) { setDashClass(_dashClass); return; }
  if (_openDashAsset === ticker){
    mount.innerHTML = ''; _openDashAsset = null;
    if (row) row.style.borderLeftWidth = '2px';
    return;
  }
  if (_openDashAsset){ const p=document.getElementById('dr_'+_openDashAsset); if(p) p.style.borderLeftWidth='2px'; }
  _openDashAsset = ticker;
  if (row){ row.style.borderLeftWidth='4px'; row.scrollIntoView({behavior:'smooth',block:'nearest'}); }
  mount.innerHTML = `<div style="padding:18px;text-align:center;color:#4a5568;font-size:12px;font-family:'IBM Plex Mono',monospace;background:#080c12;border:1px solid #1e2530;border-radius:8px">Loading ${ticker} scorecard...</div>`;
  const card = await apiFetch('/api/scorecard/' + ticker, null);
  if (!card){ mount.innerHTML = `<div style="padding:14px;color:#f56565;font-size:11px">Scorecard unavailable for ${ticker}</div>`; return; }
  mount.innerHTML = `<div style="border:1px solid #1e2530;border-radius:8px;overflow:hidden">${scorecardDetailHTML(card, `toggleDashAsset('${ticker}')`)}</div>`;
}

async function renderHeatmap() {

  const impactBg  = v => v === 'Bullish' ? '#0d2820' : v === 'Bearish' ? '#2a0a0a' : '#111418';

  // Gauge SVG
  const gauge = (pct, label, col) => {
    const angle  = (pct / 100) * 180 - 90; // -90 to +90 degrees
    const rad    = angle * Math.PI / 180;
    const nx     = 50 + 35 * Math.sin(rad);
    const ny     = 50 - 35 * Math.cos(rad);
    return `<div style="text-align:center">
      <svg width="100" height="60" viewBox="0 0 100 55">
        <!-- Background arc -->
        <path d="M 10 50 A 40 40 0 0 1 90 50" fill="none" stroke="#1e2530" stroke-width="8" stroke-linecap="round"/>
        <!-- Bearish arc (left) -->
        <path d="M 10 50 A 40 40 0 0 1 50 10" fill="none" stroke="#f5656555" stroke-width="8" stroke-linecap="round"/>
        <!-- Bullish arc (right) -->
        <path d="M 50 10 A 40 40 0 0 1 90 50" fill="none" stroke="#48d59755" stroke-width="8" stroke-linecap="round"/>
        <!-- Needle -->
        <line x1="50" y1="50" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="${col}" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="50" cy="50" r="3" fill="${col}"/>
        <!-- Labels -->
        <text x="8"  y="54" font-size="7" fill="#f56565" font-family="monospace">Bear</text>

        ${(() => {
          const missing = rows.filter(r => !r.actual).length;
          const fmpOk = data.fmp_available, fredOk = data.fred_key_set;
          if (!missing && fmpOk) return '';
          const bits = [];
          bits.push(`FRED key ${fredOk ? '<span style="color:#48d597">set</span>' : '<span style="color:#f56565">missing</span>'}`);
          bits.push(`FMP ${fmpOk ? '<span style="color:#48d597">live</span>' : '<span style="color:#f6a05a">unavailable</span>'}`);
          if (missing) bits.push(`<span style="color:#f6a05a">${missing} indicator${missing>1?'s':''} missing data — hover ⚠ for why</span>`);
          return `<div style="font-size:11px;color:#4a5568;margin-top:6px;font-family:'IBM Plex Mono',monospace">⚙ ${bits.join(' · ')}</div>`;
        })()}
      </div>
      <!-- Gauge dials -->
      <div style="display:flex;gap:24px;align-items:center;background:#080c12;border:1px solid #1e2530;border-radius:10px;padding:12px 20px">
        ${gauge(usdPct,    'USD',      usdPct >= 55 ? '#48d597' : usdPct <= 45 ? '#f56565' : '#f6c90e')}
        <div style="width:1px;height:60px;background:#1e2530"></div>
        ${gauge(stocksPct, 'US Stocks', stocksPct >= 55 ? '#48d597' : stocksPct <= 45 ? '#f56565' : '#f6c90e')}
      </div>
    </div>

    <!-- Heatmap table -->
    <div style="background:#080c12;border:1px solid #1e2530;border-radius:10px;overflow:hidden">

      <div style="display:grid;grid-template-columns:160px 80px 90px 90px 90px 1fr 90px 100px;gap:0;background:#0d1117;border-bottom:1px solid #1e2530;padding:8px 12px;font-size:9px;color:#4a5568;font-family:'IBM Plex Mono',monospace;letter-spacing:.8px">

        <div>CHANGE</div>
        <div>ACTUAL</div>
        <div>PREVIOUS</div>
        <div></div>
        <div>USD IMPACT</div>
        <div>STOCKS IMPACT</div>
      </div>

      <!-- Rows grouped by category -->
      ${['Growth','Inflation','Employment','Fed Policy','Sentiment'].map(cat => {
        const catRows = rows.filter(r => r.category === cat);
        if (!catRows.length) return '';
        return `
          <!-- Category header -->
          <div style="background:#0a0d12;border-bottom:1px solid #1e253033;padding:5px 12px">
            <span style="font-size:9px;font-weight:700;color:${catCol(cat)};font-family:'IBM Plex Mono',monospace;letter-spacing:1.5px">${cat.toUpperCase()}</span>

              <!-- Indicator name -->
              <div style="font-size:12px;color:#e2e8f0;font-weight:500">${r.label}${(!r.actual && r.reason) ? `<span title="${String(r.reason).replace(/"/g,'&quot;')}" style="margin-left:7px;color:#f6a05a;font-size:10px;cursor:help;font-family:'IBM Plex Mono',monospace">⚠ no data</span>` : ''}</div>
              <!-- Date -->
              <div style="font-size:10px;color:#4a5568;font-family:'IBM Plex Mono',monospace">${r.date}</div>
              <!-- Change -->
              <div style="font-size:11px;font-weight:600;color:${changeCol(r.change_fmt)};font-family:'IBM Plex Mono',monospace">${r.change_fmt}</div>
              <!-- Actual -->
              <div style="font-size:12px;color:${r.actual ? '#60a8ff' : '#4a5568'};font-family:'IBM Plex Mono',monospace;font-weight:${r.actual ? '600':'400'}">${r.actual_fmt}</div>
              <!-- Previous -->
              <div style="font-size:11px;color:#4a5568;font-family:'IBM Plex Mono',monospace">${r.previous_fmt}</div>
              <!-- Spacer -->
              <div></div>
              <!-- USD Impact -->
              <div>
                <span style="background:${impactBg(r.usd_impact)};color:${impactCol(r.usd_impact)};padding:3px 10px;border-radius:4px;font-size:10px;font-family:'IBM Plex Mono',monospace;font-weight:600">
                  ${r.usd_impact}
                </span>
              </div>
              <!-- Stocks Impact -->
              <div>
                <span style="background:${impactBg(r.stocks_impact)};color:${impactCol(r.stocks_impact)};padding:3px 10px;border-radius:4px;font-size:10px;font-family:'IBM Plex Mono',monospace;font-weight:600">
                  ${r.stocks_impact}
                </span>
              </div>
            </div>`).join('')}`;
      }).join('')}

      <!-- Summary row -->
      <div style="display:grid;grid-template-columns:160px 80px 90px 90px 90px 1fr 90px 100px;gap:0;padding:10px 12px;background:#0d1117;border-top:1px solid #1e2530;align-items:center">
        <div style="font-size:10px;color:#4a5568;font-family:'IBM Plex Mono',monospace;letter-spacing:.5px;grid-column:1/7">OVERALL BIAS SCORE</div>
        <div>
          <span style="font-size:14px;font-weight:700;color:${usdPct >= 55 ? '#48d597' : usdPct <= 45 ? '#f56565' : '#f6c90e'};font-family:'IBM Plex Mono',monospace">${usdPct}%</span>
        </div>
        <div>
          <span style="font-size:14px;font-weight:700;color:${stocksPct >= 55 ? '#48d597' : stocksPct <= 45 ? '#f56565' : '#f6c90e'};font-family:'IBM Plex Mono',monospace">${stocksPct}%</span>
        </div>
      </div>
    </div>

    <div style="margin-top:10px;font-size:11px;color:#2a3441;padding:0 4px">
      Source: Federal Reserve FRED · Change = latest vs previous reading · Not financial advice
    </div>`;
}

async function renderRegime() {
  const el = document.getElementById('mainContent');
  showSpinner('Running intelligence engine...');
  const rie = await apiFetch('/api/regime', null);
  if (!rie) { showErr('Intelligence engine unavailable'); return; }

  // ── Fields ───────────────────────────────────────────────
  const score   = rie.regime_score ?? 50;
  const label   = rie.regime_label || 'Neutral';
  const col     = rie.regime_color || '#f6c90e';
  const bg      = rie.regime_bg    || '#1a1500';
  const conf    = rie.confidence   ?? 50;
  const summary = rie.summary      || '';
  const trend   = rie.regime_trend || 'Stable';
  const d1w     = rie.change_1w;
  const d1m     = rie.change_1m;
  const pillars = rie.pillars      || {};
  const horizons= rie.horizons     || {};
  const assets  = rie.asset_scores || {};
  const wc      = rie.what_changed || { items: [], available: false, basis: '' };
  const env     = rie.environment  || { favours: [], pressures: [] };
  const delta   = rie.delta        || {};

  // ── Helpers ──────────────────────────────────────────────
  const pCol  = s => s>=60?'#48d597':s<=40?'#f56565':'#f6c90e';
  const cCol  = c => c>=75?'#48d597':c>=55?'#f6c90e':'#f56565';
  const hCol  = h => (h||{}).color || '#f6c90e';
  const fitCol= f => f==='Strong'?'#48d597':f==='Weak'?'#f56565':'#f6c90e';
  const tIcon = t => t==='Improving'?'▲':t==='Deteriorating'?'▼':'■';
  const tCol  = t => t==='Improving'?'#48d597':t==='Deteriorating'?'#f56565':'#718096';
  const trendBadge = t => `<span style="font-size:10px;color:${tCol(t)};font-family:'IBM Plex Mono',monospace;white-space:nowrap">${tIcon(t)} ${t}</span>`;

            <div>
              <div style="font-family:'IBM Plex Mono',monospace;font-weight:600;color:#e2e8f0;font-size:13px">${a.t}</div>
              <div style="font-size:10px;color:#4a5568;margin-top:1px">${a.n} · ${a.signals?.[0]||''}</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:18px;font-weight:700;color:${scoreCol(a.score)};font-family:'IBM Plex Mono',monospace">${a.score>0?'+':''}${a.score}</div>
              <div style="font-size:10px;color:${pnlCol(a.changePct)}">${a.changePct>=0?'+':''}${(a.changePct||0).toFixed(2)}%</div>
            </div>
          </div>`).join('') : '<div style="font-size:12px;color:#4a5568;padding:12px 0">No strong bullish macro signals — markets neutral</div>'}
      </div>

      <!-- Macro headwinds -->
      <div style="background:#080c12;border:1px solid #1e2530;border-radius:10px;padding:16px">
        <div style="font-size:10px;color:#f56565;font-family:'IBM Plex Mono',monospace;letter-spacing:1.5px;margin-bottom:12px">▼ MACRO HEADWINDS — BEARISH SIGNALS</div>
        ${topBearish.length ? topBearish.map(a => `
          <div onclick="document.getElementById('searchInput').value='${a.t}';setInvestTab('analysis');loadTicker('${a.t}')"
               style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #1e253033;cursor:pointer;transition:opacity .15s"
               onmouseover="this.style.opacity='.7'" onmouseout="this.style.opacity='1'">
            <div>
              <div style="font-family:'IBM Plex Mono',monospace;font-weight:600;color:#e2e8f0;font-size:13px">${a.t}</div>
              <div style="font-size:10px;color:#4a5568;margin-top:1px">${a.n} · ${a.signals?.[0]||''}</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:18px;font-weight:700;color:${scoreCol(a.score)};font-family:'IBM Plex Mono',monospace">${a.score>0?'+':''}${a.score}</div>
              <div style="font-size:10px;color:${pnlCol(a.changePct)}">${a.changePct>=0?'+':''}${(a.changePct||0).toFixed(2)}%</div>
            </div>
          </div>`).join('') : '<div style="font-size:12px;color:#4a5568;padding:12px 0">No strong bearish macro signals</div>'}
        <div style="margin-top:10px;font-size:11px;color:#4a5568">Short opportunities or assets to reduce exposure</div>
      </div>
    </div>

    <!-- Economic themes driving the view -->
    ${(hotData.length || coldData.length) ? `
    <div style="background:#080c12;border:1px solid #1e2530;border-radius:10px;padding:14px;margin-bottom:14px">
      <div style="font-size:10px;color:#4a5568;font-family:'IBM Plex Mono',monospace;letter-spacing:1.5px;margin-bottom:10px">ECO HEATMAP — WHAT'S DRIVING THE VIEW</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        ${hotData.length ? `<div>
          <div style="font-size:10px;color:#48d597;margin-bottom:6px">✓ Bullish for stocks</div>
          ${hotData.slice(0,4).map(d => `<div style="font-size:12px;color:#718096;margin-bottom:3px">· ${d}</div>`).join('')}
        </div>` : ''}
        ${coldData.length ? `<div>
          <div style="font-size:10px;color:#f56565;margin-bottom:6px">✗ Bearish for stocks</div>
          ${coldData.slice(0,4).map(d => `<div style="font-size:12px;color:#718096;margin-bottom:3px">· ${d}</div>`).join('')}
        </div>` : ''}
      </div>
    </div>` : ''}

    <!-- Watchlist signals -->
    <div style="background:#080c12;border:1px solid #1e2530;border-radius:10px;padding:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div style="font-size:10px;color:#4a5568;font-family:'IBM Plex Mono',monospace;letter-spacing:1.5px">YOUR WATCHLIST — SIGNALS TODAY</div>
        <button onclick="setInvestTab('watchlist')" style="font-size:11px;color:#4a5568;background:none;border:1px solid #1e2530;padding:3px 10px;border-radius:4px;cursor:pointer">Full Watchlist →</button>
      </div>
      ${wlSignals.length ? wlSignals.map(s => `
        <div onclick="document.getElementById('searchInput').value='${s.ticker}';setInvestTab('analysis');loadTicker('${s.ticker}')"
             style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #1e253033;cursor:pointer"
             onmouseover="this.style.opacity='.7'" onmouseout="this.style.opacity='1'">
          <span style="font-family:'IBM Plex Mono',monospace;font-weight:600;color:#e2e8f0;min-width:50px">${s.ticker}</span>
          <div style="display:flex;gap:5px;flex-wrap:wrap;flex:1">
            ${s.signals.map(sig => `<span style="font-size:10px;color:${sig.col};background:${sig.col}15;border:1px solid ${sig.col}33;padding:1px 7px;border-radius:3px;font-family:'IBM Plex Mono',monospace">${sig.txt}</span>`).join('')}
          </div>
          <span style="font-size:12px;color:${pnlCol(s.changePct)};font-family:'IBM Plex Mono',monospace">${s.changePct>=0?'+':''}${(s.changePct||0).toFixed(2)}%</span>
        </div>`).join('') :
        `<div style="font-size:12px;color:#4a5568;padding:8px 0">
          ${watchlist.length === 0 ? 'Add stocks to your watchlist in INVESTMENTS → Watchlist' : 'No significant signals on your watchlist today'}
        </div>`}
    </div>`;
}

// ── Catalyst Calendar View ────────────────────────────────────────
async function renderCalendarView() {
  const el = document.getElementById('mainContent');
  showSpinner('Loading catalysts...');
  const data = await apiFetch('/api/calendar', {events:[]});
  const events = data?.events || [];
  const today  = new Date().toISOString().slice(0,10);

  const impCol = i => i==='HIGH'?'#f56565':i==='MEDIUM'?'#f6c90e':'#4a5568';
  const surpriseCol = s => s==='BEAT'?'#48d597':s==='MISS'?'#f56565':'#718096';

  const upcoming = events.filter(e => e.date >= today).slice(0, 20);
  const past     = events.filter(e => e.date < today && e.actual).slice(-8).reverse();

  el.innerHTML = `
    <div style="font-size:22px;font-weight:600;color:#e2e8f0;margin-bottom:4px">Catalyst Calendar</div>
    <div style="font-size:12px;color:#4a5568;margin-bottom:18px">Upcoming economic releases · High impact events that move markets</div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <div>
        <div style="font-size:10px;color:#f6c90e;font-family:'IBM Plex Mono',monospace;letter-spacing:1.5px;margin-bottom:10px">UPCOMING EVENTS</div>
        ${upcoming.map(e => `
          <div style="display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid #1e253033">
            <div style="min-width:70px;font-size:11px;color:#4a5568;font-family:'IBM Plex Mono',monospace">${e.date.slice(5)}</div>
            <div style="flex:1">
              <div style="font-size:12px;color:#e2e8f0;font-weight:500">${e.event}</div>
              <div style="font-size:10px;color:#4a5568;margin-top:2px">Forecast: <span style="color:#f6c90e">${e.forecast||'—'}</span> · Prev: ${e.previous||'—'}</div>
            </div>
            <span style="font-size:9px;color:${impCol(e.impact)};background:${impCol(e.impact)}18;border:1px solid ${impCol(e.impact)}33;padding:2px 7px;border-radius:3px;white-space:nowrap;font-family:'IBM Plex Mono',monospace">${e.impact}</span>
          </div>`).join('')}
      </div>
      <div>
        <div style="font-size:10px;color:#4a5568;font-family:'IBM Plex Mono',monospace;letter-spacing:1.5px;margin-bottom:10px">RECENT RESULTS</div>
        ${past.map(e => `
          <div style="display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid #1e253033">
            <div style="min-width:70px;font-size:11px;color:#4a5568;font-family:'IBM Plex Mono',monospace">${e.date.slice(5)}</div>
            <div style="flex:1">
              <div style="font-size:12px;color:#e2e8f0;font-weight:500">${e.event}</div>
              <div style="font-size:10px;margin-top:2px">
                <span style="color:#60a8ff">Actual: ${e.actual}</span>
                <span style="color:#4a5568"> · Forecast: ${e.forecast||'—'}</span>
              </div>
            </div>
            ${e.surprise ? `<span style="font-size:9px;color:${surpriseCol(e.surprise)};background:${surpriseCol(e.surprise)}18;border:1px solid ${surpriseCol(e.surprise)}33;padding:2px 7px;border-radius:3px;white-space:nowrap;font-family:'IBM Plex Mono',monospace">${e.surprise}</span>` : ''}
          </div>`).join('')}
      </div>
    </div>`;
}

</script>
