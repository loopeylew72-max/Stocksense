<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>◈ STOCKSENSE — Investment Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#0a0c10;color:#e2e8f0;min-height:100vh}
.mono{font-family:'IBM Plex Mono',monospace}
.sb-header{background:#0d1117;border-bottom:1px solid #1e2530;padding:10px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100}
.sb-logo{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;color:#48d597;letter-spacing:2px;white-space:nowrap}
.sb-search{flex:1;max-width:260px;background:#161b22;border:1px solid #2a3441;border-radius:6px;padding:8px 12px;color:#e2e8f0;font-size:13px;font-family:'IBM Plex Mono',monospace;outline:none;transition:border-color .2s}
.sb-search:focus{border-color:#48d597}
.sb-search::placeholder{color:#4a5568}
.sb-btn{background:#48d597;color:#0a0c10;border:none;border-radius:6px;padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer;font-family:'IBM Plex Mono',monospace;letter-spacing:1px;transition:background .2s;white-space:nowrap}
.sb-btn:hover{background:#3bc484}
.sb-btn:disabled{background:#1a4a35;color:#2a6a50;cursor:not-allowed}
.sb-nav{display:flex;gap:2px;margin-left:auto}
.sb-nav-btn{background:none;border:none;color:#718096;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;padding:6px 10px;border-radius:5px;transition:all .15s;font-weight:500;white-space:nowrap}
.sb-nav-btn:hover,.sb-nav-btn.active{background:#1a2030;color:#e2e8f0}
.sb-nav-btn.active{color:#48d597}
.live-dot{width:7px;height:7px;border-radius:50%;background:#48d597;display:inline-block;margin-right:5px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sb-layout{display:grid;grid-template-columns:200px 1fr;height:calc(100vh - 46px)}
.sb-sidebar{background:#0d1117;border-right:1px solid #1e2530;padding:16px 0;overflow-y:auto}
.sb-sidebar-section{margin-bottom:18px}
.sb-sidebar-label{font-size:10px;font-weight:600;color:#4a5568;letter-spacing:1.5px;text-transform:uppercase;padding:0 14px;margin-bottom:5px;font-family:'IBM Plex Mono',monospace}
.sb-sidebar-item{display:flex;align-items:center;gap:8px;padding:7px 14px;font-size:13px;color:#718096;cursor:pointer;transition:all .15s;border-left:2px solid transparent}
.sb-sidebar-item:hover{background:#161b22;color:#e2e8f0}
.sb-sidebar-item.active{background:#161b22;color:#48d597;border-left-color:#48d597}
.sb-content{overflow-y:auto;padding:18px;background:#0a0c10}
.panel{background:#0d1117;border:1px solid #1e2530;border-radius:10px;padding:16px 18px;margin-bottom:14px}
.panel-title{font-size:11px;font-weight:600;color:#4a5568;letter-spacing:1.5px;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.panel-title-dot{width:6px;height:6px;border-radius:50%;background:#48d597;flex-shrink:0}
.metrics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.metric-card{background:#0d1117;border:1px solid #1e2530;border-radius:8px;padding:12px 14px}
.metric-label{font-size:10px;color:#4a5568;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px;font-family:'IBM Plex Mono',monospace}
.metric-value{font-size:18px;font-weight:600;color:#e2e8f0;font-family:'IBM Plex Mono',monospace}
.metric-sub{font-size:11px;color:#4a5568;margin-top:2px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.positive{color:#48d597}
.negative{color:#f56565}
.ticker-header{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;padding:16px 18px;background:#0d1117;border:1px solid #1e2530;border-radius:10px;flex-wrap:wrap}
.verdict-badge{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;display:inline-block}
.verdict-buy{background:#0d2820;color:#48d597;border:1px solid #1a4a35}
.verdict-hold{background:#2a2000;color:#f6c90e;border:1px solid #4a3800}
.verdict-avoid{background:#2a0a0a;color:#f56565;border:1px solid #4a1515}
.style-badge{padding:3px 9px;border-radius:4px;font-size:11px;background:#1a2040;color:#7fb3ff;border:1px solid #2a3560;font-family:'IBM Plex Mono',monospace;display:inline-block}
.val-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #1e2530;font-size:13px}
.val-row:last-child{border-bottom:none}
.val-label{color:#718096}
.val-value{color:#e2e8f0;font-family:'IBM Plex Mono',monospace;font-weight:500}
.badge-g{color:#48d597;font-size:11px;background:#0d2820;padding:2px 7px;border-radius:4px}
.badge-r{color:#f56565;font-size:11px;background:#2a0a0a;padding:2px 7px;border-radius:4px}
.badge-y{color:#f6c90e;font-size:11px;background:#2a2000;padding:2px 7px;border-radius:4px}
.score-row{display:flex;align-items:center;margin-bottom:10px}
.score-bar-track{flex:1;height:5px;background:#1e2530;border-radius:3px;margin:0 10px;overflow:hidden}
.score-bar-fill{height:100%;border-radius:3px;transition:width .8s ease}
.tab-bar{display:flex;gap:2px;margin-bottom:16px;border-bottom:1px solid #1e2530}
.tab-btn{background:none;border:none;color:#4a5568;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;padding:7px 14px;transition:all .15s;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tab-btn:hover{color:#a0aec0}
.tab-btn.active{color:#48d597;border-bottom-color:#48d597}
.scenario-card{background:#101520;border:1px solid #1e2530;border-radius:8px;padding:12px 14px}
.ai-box{background:#0a0e1a;border:1px solid #1e2a45;border-radius:8px;padding:14px;font-size:13px;line-height:1.75;color:#a0b4d0}
.ai-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:9px;font-family:'IBM Plex Mono',monospace;font-weight:600}
.wl-row{display:flex;align-items:center;padding:8px 6px;border-bottom:1px solid #1e2530;font-size:13px;cursor:pointer;transition:background .15s;border-radius:4px}
.wl-row:hover{background:#101520}
.wl-row:last-child{border-bottom:none}
.wl-ticker{font-family:'IBM Plex Mono',monospace;font-weight:600;color:#e2e8f0;width:60px}
.wl-name{color:#718096;flex:1;font-size:12px}
.score-pill{font-size:11px;font-family:'IBM Plex Mono',monospace;padding:2px 7px;border-radius:4px;font-weight:600}
.port-row{display:grid;grid-template-columns:62px 1fr 90px 88px 70px 70px 60px;align-items:center;padding:8px 0;border-bottom:1px solid #1e2530;font-size:12px;gap:4px}
.port-row:last-child{border-bottom:none}
.port-row.header{color:#4a5568;font-size:10px;letter-spacing:.8px;font-family:'IBM Plex Mono',monospace;padding-bottom:8px}
.alloc-bar-wrap{background:#1e2530;border-radius:3px;height:4px;margin-top:3px;overflow:hidden}
.alloc-bar-fill{height:100%;border-radius:3px}
.action-btn{background:#0a1a30;border:1px solid #1e4070;color:#60a8ff;padding:9px 20px;border-radius:6px;font-size:12px;cursor:pointer;font-family:'IBM Plex Mono',monospace;transition:all .15s}
.action-btn:hover{background:#0d2040}
.loading-overlay{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:16px}
.loading-spinner{width:36px;height:36px;border:3px solid #1e2530;border-top-color:#48d597;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#4a5568;letter-spacing:1px}
.error-box{background:#1a0a0a;border:1px solid #4a1515;border-radius:8px;padding:16px;color:#f56565;font-size:13px;font-family:'IBM Plex Mono',monospace}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center}
.empty-logo{font-size:36px;margin-bottom:12px;color:#48d597;font-family:'IBM Plex Mono',monospace}
.empty-sub{font-size:14px;color:#4a5568;margin-top:8px;line-height:1.7}
.macro-indicator{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #1e2530;font-size:13px}
.macro-indicator:last-child{border-bottom:none}
.core-nav{background:none;border:none;color:#718096;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;padding:6px 14px;border-radius:5px;transition:all .15s;font-weight:600;white-space:nowrap}
.core-nav:hover{color:#e2e8f0}
.core-nav.active{background:#1a2030;color:#48d597}
.ctx-btn{background:none;border:1px solid #1e2530;color:#4a5568;font-size:14px;cursor:pointer;padding:5px 9px;border-radius:5px;transition:all .15s;line-height:1}
.ctx-btn:hover{border-color:#2a3441;color:#a0aec0;background:#0d1117}
.pillar-nav{background:none;border:none;color:#4a5568;font-size:11px;font-family:'IBM Plex Mono',monospace;cursor:pointer;padding:7px 18px;border-radius:5px;transition:all .15s;font-weight:700;white-space:nowrap;letter-spacing:.5px}
.pillar-nav:hover{color:#a0aec0;background:#0d1117}
.pillar-nav.active{background:#1a2030;color:#e2e8f0}
.sub-tab{background:none;border:none;border-bottom:2px solid transparent;color:#4a5568;font-size:11px;font-family:'IBM Plex Mono',monospace;cursor:pointer;padding:8px 16px;transition:all .15s;white-space:nowrap;letter-spacing:.3px}
.sub-tab:hover{color:#a0aec0}
.sub-tab.active{color:#48d597;border-bottom-color:#48d597}
.macro-signal{font-size:11px;padding:2px 7px;border-radius:4px;font-family:'IBM Plex Mono',monospace}
.portfolio-input{width:100%;background:#161b22;border:1px solid #2a3441;border-radius:6px;padding:8px 10px;color:#e2e8f0;font-size:12px;font-family:'IBM Plex Mono',monospace;outline:none;margin-bottom:8px;resize:vertical;min-height:100px}
.portfolio-input:focus{border-color:#48d597}
.wl-input{background:#161b22;border:1px solid #2a3441;border-radius:5px;padding:6px 10px;color:#e2e8f0;font-size:12px;font-family:'IBM Plex Mono',monospace;outline:none;width:130px}
.wl-input:focus{border-color:#48d597}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:#0d1117}
::-webkit-scrollbar-thumb{background:#2a3441;border-radius:2px}
@media(max-width:768px){.sb-layout{grid-template-columns:1fr}.sb-sidebar{display:none}.metrics-grid{grid-template-columns:repeat(2,1fr)}.two-col,.three-col{grid-template-columns:1fr}.port-row{grid-template-columns:55px 1fr 80px 70px}}
</style>
</head>
<body>
<div id="app">
  <div class="sb-header">
    <div class="sb-logo">◈ STOCKSENSE</div>
    <span id="liveInd" style="font-size:11px;color:#48d597;font-family:'IBM Plex Mono',monospace;white-space:nowrap;margin-right:8px"><span class="live-dot"></span>Live</span>
    <!-- 3 pillar nav -->
    <div style="display:flex;gap:1px;background:#080c12;border:1px solid #1e2530;border-radius:8px;padding:3px">
      <button class="pillar-nav active" id="nav-markets" onclick="showPillar('markets')">MARKETS</button>
      <button class="pillar-nav" id="nav-investments" onclick="showPillar('investments')">INVESTMENTS</button>
      <button class="pillar-nav" id="nav-portfolio" onclick="showPillar('portfolio_home')">PORTFOLIO</button>
    </div>
    <!-- Search — always visible -->
    <input class="sb-search" id="searchInput" type="text" placeholder="Search any ticker..." maxlength="20" style="max-width:220px;margin-left:12px"/>
    <button class="sb-btn" id="analyzeBtn" onclick="handleSearch()">ANALYZE</button>
  </div>
  <div class="sb-layout">
    <div class="sb-sidebar" id="mainSidebar">
      <!-- Sidebar content is injected per-view -->
      <div id="sidebarContent"></div>
    </div>
    <div class="sb-content" id="mainContent">
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────
const CACHE_TTL   = 10 * 60 * 1000; // 10 minutes
const _cacheStore = {};              // { ticker: { data, ts } }
const _pending    = {};              // in-flight requests — prevents duplicates
let activeCharts  = [];
let currentTicker = '';
let currentView   = 'today';
let currentTab    = 'overview';
let watchlist     = JSON.parse(localStorage.getItem('sb_watchlist') || '["AAPL","NVDA","MSFT","AMZN","META","TSLA"]');
let portfolio     = JSON.parse(localStorage.getItem('sb_portfolio_v2') || '[]');
// portfolio item: { id, ticker, shares, avgCost, thesis, addedDate }
let _portfolioMode = localStorage.getItem('sb_port_mode') === 'portfolio' ? 'portfolio' : 'watch';
let currentPillar  = 'markets';
let marketsTab     = 'today';
let investTab      = 'analysis';
let _portCurrency  = localStorage.getItem('sb_currency') || 'USD';
const FX_RATES     = { USD: 1, GBP: 0.787, EUR: 0.924 }; // approximate — updated periodically
function portFx(v) { return v * (FX_RATES[_portCurrency] || 1); }
function portSym() { return _portCurrency === 'GBP' ? '£' : _portCurrency === 'EUR' ? '€' : '$'; }
function setCurrency(c) {
  _portCurrency = c;
  localStorage.setItem('sb_currency', c);
  renderPortfolioIntelligence();
}

// Cache helpers
const stockCache = new Proxy({}, {
  get(_, k)    { const e = _cacheStore[k]; return e && (Date.now()-e.ts < CACHE_TTL) ? e.data : null; },
  set(_, k, v) { _cacheStore[k] = {data: v, ts: Date.now()}; return true; },
});

// ── API fetch helper — handles {ok, data, error} schema ────
async function apiFetch(url, fallback=null) {
  try {
    const r    = await fetch(url);
    const json = await r.json();
    // New schema: {ok, data, error}
    if (json && 'ok' in json) {
      if (!json.ok) {
        console.warn(`[api] ${url} →`, json.error);
        return fallback;
      }
      return json.data;
    }
    // Legacy schema — return as-is
    return json;
  } catch(e) {
    console.warn(`[api] fetch failed: ${url}`, e.message);
    return fallback;
  }
}

async function apiStock(ticker) {
  const r = await fetch('/api/stock/' + ticker);
  const j = await r.json();

  // New schema: {ok, data, error}
  if (j && 'ok' in j) {
    if (j.ok) return j.data;

    const msg  = j.error || 'Unknown error';
    const code = j.code  || '';

    // Not found — hard fail
    if (code === 'NOT_FOUND' || msg.includes('not found')) {
      throw new Error('NOT_FOUND:' + msg);
    }
    // Rate limit — tell user to retry
    if (code === 'RATE_LIMITED' || msg.includes('Rate') || msg.includes('rate limit')) {
      throw new Error('RATE_LIMITED:' + msg);
    }
    // Any other server error — show the message but don't crash app
    throw new Error(msg);
  }

  // Legacy schema — return as-is
  if (j && j.error) throw new Error(j.error);
  return j;
}

// ── Helpers ─────────────────────────────────────────────────
function setContent(html) {
  const el = document.getElementById('mainContent');
  if (el) el.innerHTML = html;
}

function showSpinner(msg = 'Loading...') {
  setContent(`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px">
    <div class="loading-spinner"></div>
    <div style="font-size:13px;color:#4a5568;font-family:'IBM Plex Mono',monospace">${msg}</div>
  </div>`);
}

function showErr(msg) {
  setContent(`<div style="margin:40px auto;max-width:480px;background:#130a0a;border:1px solid #3a1515;border-radius:10px;padding:24px 28px">
    <div style="font-size:13px;color:#f56565;font-family:'IBM Plex Mono',monospace;margin-bottom:8px">⚠ Something went wrong</div>
    <div style="font-size:13px;color:#a0aec0;line-height:1.6">${msg}</div>
    <button onclick="showView('today')" style="margin-top:16px;background:#1a3a28;border:1px solid #2a5a38;color:#48d597;padding:8px 16px;border-radius:6px;font-size:12px;cursor:pointer">← Back to Today</button>
  </div>`);
}

// ── Search ─────────────────────────────────────────────────
let _searchDebounce;
document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { clearTimeout(_searchDebounce); handleSearch(); }
});
window.addEventListener('DOMContentLoaded', () => showPillar('markets'));

function setMarketsTab(tab) {
  marketsTab = tab;
  showView(tab === 'markets' ? 'markets' : tab);
}

function setInvestTab(tab) {
  investTab = tab;
  showView(tab);
}

async function handleSearch() {
  const val = document.getElementById('searchInput').value.toUpperCase().trim();
  if (!val) return;
  console.log('[search] Searching:', val);
  // Clear any stale cache for this ticker
  delete _cacheStore[val];
  currentTicker = val;
  currentTab = 'overview';
  // Show spinner immediately before switching view
  showSpinner('Loading ' + val + '...');
  updateSidebar('analysis');
  ['today','analysis','watchlist'].forEach(id => {
    const el = document.getElementById('nav-' + id);
    if (el) el.classList.toggle('active', id === 'analysis');
  });
  currentView = 'analysis';
  await loadTicker(val);
}

async function loadTicker(ticker) {
  ticker = ticker.toUpperCase().trim();
  if (!ticker) return;

  // Already cached and fresh
  if (stockCache[ticker]) {
    currentTicker = ticker;
    renderAnalysis();
    return;
  }

  // Already in-flight — don't fire duplicate request
  if (_pending[ticker]) {
    try { await _pending[ticker]; } catch(_) {}
    currentTicker = ticker;
    renderAnalysis();
    return;
  }

  showSpinner('Fetching data for ' + ticker + '...');
  setAnalyzeBtn(true);

  const req = apiStock(ticker).finally(() => { delete _pending[ticker]; setAnalyzeBtn(false); });
  _pending[ticker] = req;

  try {
    const data = await req;
    stockCache[ticker] = data;
    currentTicker = ticker;
    renderAnalysis();
  } catch(e) {
    const msg = e.message || '';
    console.error('[loadTicker] error for', ticker, ':', msg);
    if (msg.startsWith('RATE_LIMITED')) {
      setContent(`<div style="margin:40px auto;max-width:500px;background:#1a1500;border:1px solid #4a3800;border-radius:10px;padding:24px 28px">
        <div style="font-size:13px;color:#f6c90e;font-family:'IBM Plex Mono',monospace;margin-bottom:8px">⚠ Rate Limited</div>
        <div style="font-size:13px;color:#a0aec0;line-height:1.6;margin-bottom:16px">Alpha Vantage allows ~5 requests per minute. Please wait 60 seconds and retry.</div>
        <button onclick="loadTicker('${ticker}')" style="background:#1a3a28;border:1px solid #48d597;color:#48d597;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:13px;font-family:'IBM Plex Mono',monospace">
          ↻ Retry ${ticker}
        </button>
      </div>`);
    } else if (msg.startsWith('NOT_FOUND')) {
      setContent(`<div style="margin:40px auto;max-width:480px;background:#130a0a;border:1px solid #3a1515;border-radius:10px;padding:24px 28px">
        <div style="font-size:13px;color:#f56565;font-family:'IBM Plex Mono',monospace;margin-bottom:8px">⚠ Not Found</div>
        <div style="font-size:13px;color:#a0aec0;line-height:1.6">Ticker <strong style="color:#e2e8f0">${ticker}</strong> not found. Check the symbol and try again.</div>
        <button onclick="showView('today')" style="margin-top:16px;background:#1a2030;border:1px solid #2a3441;color:#718096;padding:8px 16px;border-radius:6px;font-size:12px;cursor:pointer">← Back to Today</button>
      </div>`);
    } else {
      setContent(`<div style="margin:40px auto;max-width:480px;background:#130a0a;border:1px solid #3a1515;border-radius:10px;padding:24px 28px">
        <div style="font-size:13px;color:#f56565;font-family:'IBM Plex Mono',monospace;margin-bottom:8px">⚠ Could not load ${ticker}</div>
        <div style="font-size:13px;color:#a0aec0;line-height:1.6;margin-bottom:16px">${msg || 'Data service error. Please try again.'}</div>
        <div style="display:flex;gap:10px">
          <button onclick="loadTicker('${ticker}')" style="background:#1a3a28;border:1px solid #48d597;color:#48d597;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:12px">↻ Retry</button>
          <button onclick="showView('today')" style="background:#1a2030;border:1px solid #2a3441;color:#718096;padding:8px 16px;border-radius:6px;font-size:12px;cursor:pointer">← Back to Today</button>
        </div>
      </div>`);
    }
  }
}

function setAnalyzeBtn(loading) {
  const btn = document.getElementById('analyzeBtn');
  if (!btn) return;
  btn.disabled = loading;
  btn.style.opacity = loading ? '0.6' : '1';
  btn.textContent = 'ANALYZE';
}

// ── Views ──────────────────────────────────────────────────
function showPillar(pillar) {
  currentPillar = pillar;
  ['markets','investments','portfolio'].forEach(id => {
    const el = document.getElementById('nav-' + id);
    if (el) el.classList.toggle('active',
      id === pillar || (id === 'portfolio' && pillar === 'portfolio_home'));
  });
  if      (pillar === 'markets')          showView(marketsTab || 'regime');
  else if (pillar === 'investments')      showView(investTab  || 'opportunities');
  else if (pillar === 'portfolio_home')   showView('portfolio');
}

function setMarketsTab(tab) {
  marketsTab = tab;
  document.querySelectorAll('.markets-sub').forEach(el =>
    el.classList.toggle('active', el.dataset.tab === tab));
  showView(tab);
}

function setInvestTab(tab) {
  investTab = tab;
  document.querySelectorAll('.invest-sub').forEach(el =>

function normaliseStock(raw) {
  const s = Object.assign({}, raw);
  const n = (v, d=0) => (v !== null && v !== undefined && isFinite(Number(v))) ? Number(v) : d;
  s.price     = n(s.price, 0);   s.change    = n(s.change, 0);
  s.changePct = n(s.changePct, 0); s.fairValue = n(s.fairValue, s.price);
  s.bull      = n(s.bull,  s.price * 1.2);  s.base = n(s.base, s.price);
  s.bear      = n(s.bear,  s.price * 0.8);  s.beta = n(s.beta, 1);
  s.peRatio   = n(s.peRatio, 0); s.fwdPE   = n(s.fwdPE, 0);
  s.peg       = n(s.peg, 0);     s.priceBook = n(s.priceBook, 0);
  s.eps       = n(s.eps, 0);     s.analystTarget = n(s.analystTarget, s.price);
  s.dividend  = n(s.dividend, 0); s.divYield = n(s.divYield, 0);
  s.week52High = n(s.week52High, s.price*1.1); s.week52Low = n(s.week52Low, s.price*0.9);
  s.grossMargin = n(s.grossMargin, 0); s.opMargin = n(s.opMargin, 0);
  s.netMargin = n(s.netMargin, 0); s.roe = n(s.roe, 0); s.roa = n(s.roa, 0);
  s.roic = n(s.roic, 0); s.revenueGrowth = n(s.revenueGrowth, 0);
  s.epsGrowth = n(s.epsGrowth, 0); s.debtEquity = n(s.debtEquity, 0);
  s.currentRatio = n(s.currentRatio, 0); s.quickRatio = n(s.quickRatio, 0);
  s.fcfYield = n(s.fcfYield, 0); s.insiderOwn = n(s.insiderOwn, 0);
  s.instOwn  = n(s.instOwn, 0);  s.score = n(s.score, 50);
  s.buyCount = n(s.buyCount, 0); s.holdCount = n(s.holdCount, 0); s.sellCount = n(s.sellCount, 0);
  s.name    = s.name    || s.ticker || '—';
  s.sector  = s.sector  || '';   s.exchange = s.exchange || '';
  s.verdict = s.verdict || 'HOLD'; s.grade  = s.grade   || 'C';
  s.style   = s.style   || 'Blend';
  s.revenue = Array.isArray(s.revenue) ? s.revenue : [];
  s.earnings = Array.isArray(s.earnings) ? s.earnings : [];
  s.revenueLabels = Array.isArray(s.revenueLabels) ? s.revenueLabels : [];
  s.scores  = s.scores  || {};
  return s;
}

// ── AI Analysis ────────────────────────────────────────────
async function generateAI() {
  const s = stockCache[currentTicker];
  if (!s) return;
  const btn = document.querySelector('#tabBody button');
  if (btn) { btn.textContent = '⏳ Generating...'; btn.disabled = true; }

  // Use Anthropic API if key available, otherwise provide structured fallback
  const ANTHROPIC_KEY = localStorage.getItem('sb_ant') || '';

  if (!ANTHROPIC_KEY) {
    s.aiSummary = `${s.name} operates in the ${s.sector} sector with a market cap of ${s.mktCap}. The company has a net margin of ${s.netMargin}% and ROIC of ${s.roic}%, indicating ${s.roic>15?'strong':'moderate'} capital efficiency. Revenue growth of ${s.revenueGrowth}% YoY reflects the business momentum.`;
    s.bullThesis = `The company trades at ${s.peRatio}x earnings vs a fair value estimate of $${s.fairValue}, implying ${s.price<s.fairValue?'upside potential of '+s.price>0?s.price>0?(((s.fairValue-s.price)/s.price)*100).toFixed(1)+'%':'—':'—':'a premium valuation'}. Strong ${s.revenueGrowth}% revenue growth and ${s.grossMargin}% gross margins support the ${s.verdict} thesis.`;
    s.bearThesis = `At ${s.peRatio}x P/E and debt/equity of ${s.debtEquity}x, the risk/reward is ${s.peRatio>35?'stretched':'moderate'}. Current ratio of ${s.currentRatio}x ${s.currentRatio<1?'raises liquidity concerns':'is adequate'}. Macro headwinds and sector rotation remain key risks.`;
    renderTabBody();
    return;
  }

  try {
    const prompt = `Analyze ${s.ticker} (${s.name}) with these metrics: Price $${s.price}, P/E ${s.peRatio}x, Revenue Growth ${s.revenueGrowth}%, Net Margin ${s.netMargin}%, ROIC ${s.roic}%, Fair Value $${s.fairValue}, Score ${s.score}/100, Verdict ${s.verdict}.
Return JSON only: {"summary":"2-3 sentences on business quality","bull":"2-3 sentences on bull case","bear":"2-3 sentences on bear case"}`;

    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':ANTHROPIC_KEY,'anthropic-version':'2023-06-01'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:400,messages:[{role:'user',content:prompt}]})
    });
    const d = await res.json();
    const parsed = JSON.parse(d.content?.[0]?.text?.replace(/```json|```/g,'').trim()||'{}');
    s.aiSummary = parsed.summary || '';
    s.bullThesis = parsed.bull || '';
    s.bearThesis = parsed.bear || '';
  } catch(e) {
    s.aiSummary = `${s.name} (${s.ticker}) — ${s.sector} · Score: ${s.score}/100 · Verdict: ${s.verdict}`;
    s.bullThesis = `Revenue growth of ${s.revenueGrowth}% with ${s.netMargin}% net margins supports the investment case.`;
    s.bearThesis = `Valuation at ${s.peRatio}x earnings warrants caution. Monitor macro conditions.`;
  }
  renderTabBody();
}

async function renderWatchlist() {
  const el = document.getElementById('mainContent');
  el.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-size:22px;font-weight:600;color:#e2e8f0">My Watchlist</div>
        <div style="font-size:12px;color:#4a5568;margin-top:3px">Ranked by signal strength · Click any row to research</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <input class="wl-input" id="wlInput" placeholder="Add ticker..." onkeydown="if(event.key==='Enter')addToWatchlist()" style="width:150px"/>
        <button class="sb-btn" style="padding:7px 16px;font-size:11px" onclick="addToWatchlist()">+ Add</button>
      </div>
    </div>
    <div id="wlRows"><div class="loading-overlay" style="padding:30px"><div class="loading-spinner"></div><div class="loading-text">Loading watchlist intelligence...</div></div></div>`;

  if (watchlist.length === 0) {
    document.getElementById('wlRows').innerHTML = `
      <div style="text-align:center;padding:60px 20px;color:#4a5568">
        <div style="font-size:36px;margin-bottom:12px">👁</div>
        <div style="font-size:16px;color:#718096;margin-bottom:8px">Your watchlist is empty</div>
        <div style="font-size:13px">Search for a stock and add it, or type a ticker above</div>
      </div>`;
    return;
  }

  try {
    const quotes = await apiFetch('/api/quotes?tickers=' + watchlist.join(','), []) || [];

    // Sort by signal priority: BUY first, then by score
    const sorted = [...quotes].sort((a,b) => {
      const vOrd = {BUY:0, HOLD:1, AVOID:2};
      const vDiff = (vOrd[a.verdict]||1) - (vOrd[b.verdict]||1);
      return vDiff !== 0 ? vDiff : (b.score||0) - (a.score||0);
    });

    // Generate signals for each stock
    const withSignals = sorted.map(q => {
      const signals = [];
      const cached  = stockCache[q.ticker];
      if (q.changePct > 3)  signals.push({msg:'Big move up today',     col:'#48d597', icon:'⚡'});
      if (q.changePct < -3) signals.push({msg:'Big move down today',    col:'#f56565', icon:'⚡'});
      if (cached) {
        if (cached.price < cached.fairValue * 0.88) signals.push({msg:'~'+ Math.round((1-cached.price/cached.fairValue)*100)+'% below fair value', col:'#48d597', icon:'💰'});
        if (cached.price > cached.fairValue * 1.15) signals.push({msg:'Looks overvalued vs DCF',  col:'#f56565', icon:'⚠️'});
        if (cached.revenueGrowth > 20) signals.push({msg:'High growth: +'+cached.revenueGrowth+'% rev', col:'#48d597', icon:'📈'});
      }
      if (signals.length === 0) signals.push({msg:'No significant signals', col:'#4a5568', icon:'—'});
      return {...q, signals};
    });

    document.getElementById('wlRows').innerHTML = `
      <!-- Header -->
      <div style="display:grid;grid-template-columns:80px 1fr 90px 80px 80px 90px 180px 32px;gap:6px;padding:6px 12px;font-size:10px;color:#4a5568;font-family:'IBM Plex Mono',monospace;letter-spacing:.5px;border-bottom:1px solid #1e2530;margin-bottom:4px">
        <div>TICKER</div><div>NAME</div><div>PRICE</div><div>TODAY</div><div>SCORE</div><div>SIGNAL</div><div>WHY</div><div></div>
      </div>
      ${withSignals.map(q => {
        const vclass = q.verdict==='BUY'?'verdict-buy':q.verdict==='HOLD'?'verdict-hold':'verdict-avoid';
        const sig = q.signals[0];
        return `
        <div onclick="loadFromWL('${q.ticker}')"
             style="display:grid;grid-template-columns:80px 1fr 90px 80px 80px 90px 180px 32px;gap:6px;align-items:center;padding:10px 12px;border-bottom:1px solid #1e253033;cursor:pointer;border-radius:5px;transition:background .15s"
             onmouseover="this.style.background='#101520'" onmouseout="this.style.background='transparent'">
          <div style="font-family:'IBM Plex Mono',monospace;font-weight:600;color:#e2e8f0">${q.ticker}</div>
          <div style="font-size:12px;color:#718096;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${q.name}</div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:#e2e8f0">$${(q.price||0).toFixed(2)}</div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:${q.changePct>=0?'#48d597':'#f56565'}">${q.changePct>=0?'+':''}${(q.changePct||0).toFixed(2)}%</div>
          <div>
            <span style="font-size:15px;font-weight:700;color:${getScoreColor(q.score)};font-family:'IBM Plex Mono',monospace">${q.score}</span>
          </div>
          <div>
            <span class="verdict-badge ${vclass}" style="font-size:10px;padding:3px 8px">${q.verdict}</span>
          </div>
          <div style="font-size:11px;color:${sig.col}">${sig.icon} ${sig.msg}</div>
          <div onclick="event.stopPropagation();removeFromWL('${q.ticker}')" style="color:#2a3441;cursor:pointer;font-size:14px;text-align:center" onmouseover="this.style.color='#f56565'" onmouseout="this.style.color='#2a3441'">✕</div>
        </div>`;
      }).join('')}
      <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
        <button onclick="showView('scanner')" style="background:#0a0e1a;border:1px solid #1e2530;color:#4a5568;padding:8px 16px;border-radius:6px;font-size:12px;cursor:pointer;transition:all .15s" onmouseover="this.style.borderColor='#f6c90e';this.style.color='#f6c90e'" onmouseout="this.style.borderColor='#1e2530';this.style.color='#4a5568'">⚡ Find more opportunities</button>
        <button onclick="showView('today')" style="background:#0a0e1a;border:1px solid #1e2530;color:#4a5568;padding:8px 16px;border-radius:6px;font-size:12px;cursor:pointer;transition:all .15s" onmouseover="this.style.borderColor='#48d597';this.style.color='#48d597'" onmouseout="this.style.borderColor='#1e2530';this.style.color='#4a5568'">📋 Back to Today</button>
      </div>`;
  } catch(e) {
    document.getElementById('wlRows').innerHTML = '<div style="color:#f56565;padding:10px;font-size:12px">Could not load watchlist data</div>';
  }
}

async function loadFromWL(ticker) {
  currentTicker = ticker;
  currentTab = 'overview';
  document.getElementById('searchInput').value = ticker;
  showView('analysis');
  if (!stockCache[ticker]) await loadTicker(ticker);
  else renderAnalysis();
}

function addToWatchlist() {
  const val = document.getElementById('wlInput')?.value.toUpperCase().trim();
  if (!val || watchlist.includes(val)) return;
  watchlist.push(val);
  localStorage.setItem('sb_watchlist', JSON.stringify(watchlist));
  renderWatchlist();
}

function removeFromWL(ticker) {
  watchlist = watchlist.filter(t => t!==ticker);
  localStorage.setItem('sb_watchlist', JSON.stringify(watchlist));
  renderWatchlist();
}

function renderPortfolio() {
  const content = document.getElementById('mainContent');
  content.innerHTML = `
    <div class="panel">
      <div class="panel-title"><div class="panel-title-dot"></div>Import Holdings</div>
      <div style="font-size:12px;color:#718096;margin-bottom:10px">One per line: TICKER, SHARES, AVG_COST_£</div>

function savePortfolio() {
  const text = document.getElementById('portInput')?.value || '';
  const lines = text.split('\n').filter(l => l.trim());
  portfolioHoldings = lines.map(l => {
    const [ticker, shares, avgCost] = l.split(',').map(s => s.trim());
    return ticker && shares && avgCost ? { ticker: ticker.toUpperCase(), shares: parseFloat(shares), avgCost: parseFloat(avgCost) } : null;
  }).filter(Boolean);
  localStorage.setItem('sb_portfolio', JSON.stringify(portfolioHoldings));
  alert('Portfolio saved!');
}

async function analysePortfolio() {
  const text = document.getElementById('portInput')?.value || '';
  const lines = text.split('\n').filter(l => l.trim());
  const holdings = lines.map(l => {
    const [ticker, shares, avgCost] = l.split(',').map(s => s.trim());
    return ticker && shares && avgCost ? { ticker: ticker.toUpperCase(), shares: parseFloat(shares), avgCost: parseFloat(avgCost), current: parseFloat(avgCost) } : null;
  }).filter(Boolean);
  if (!holdings.length) return;

  document.getElementById('portResults').innerHTML = '<div class="loading-overlay" style="padding:20px"><div class="loading-spinner"></div><div class="loading-text">Fetching live prices...</div></div>';

  try {
    const res = {json: async () => await apiFetch('/api/quotes?tickers=' + holdings.map(h=>h.ticker).join(','), [])};
    const quotes = await res.json();
    quotes.forEach(q => { const h = holdings.find(x=>x.ticker===q.ticker); if(h) h.current = q.price; });
  } catch(e) {}

  const total = holdings.reduce((a,h) => a+h.shares*h.current, 0);
  const cost  = holdings.reduce((a,h) => a+h.shares*h.avgCost, 0);
  const gain  = total - cost;

  document.getElementById('portResults').innerHTML = `
    <div class="metrics-grid" style="margin-bottom:14px">
      <div class="metric-card"><div class="metric-label">Portfolio Value</div><div class="metric-value">£${(total/1000).toFixed(1)}K</div></div>
      <div class="metric-card"><div class="metric-label">Total Gain</div><div class="metric-value positive">+£${(gain).toFixed(0)}</div><div class="metric-sub positive">+${((gain/cost)*100).toFixed(1)}%</div></div>
      <div class="metric-card"><div class="metric-label">Positions</div><div class="metric-value">${holdings.length}</div></div>
      <div class="metric-card"><div class="metric-label">Cost Basis</div><div class="metric-value">£${(cost/1000).toFixed(1)}K</div></div>
    </div>
    <div class="panel">
      <div class="panel-title"><div class="panel-title-dot"></div>Holdings</div>
      <div class="port-row header"><span>Ticker</span><span>Company</span><span>Value</span><span>Gain/Loss</span><span>Return</span><span>Alloc</span><span>Score</span></div>
      ${holdings.map(h => {
        const val=h.shares*h.current, g=h.shares*(h.current-h.avgCost), ret=((h.current-h.avgCost)/h.avgCost*100).toFixed(1);
        const alloc=((val/total)*100).toFixed(1);
        const cached=stockCache[h.ticker], score=cached?.score||50;
        return `<div class="port-row" style="cursor:pointer" onclick="loadFromWL('${h.ticker}')">
          <span style="font-family:'IBM Plex Mono',monospace;font-weight:600;color:#e2e8f0">${h.ticker}</span>
          <span style="color:#a0aec0">${cached?.name||h.ticker}</span>
          <span style="font-family:'IBM Plex Mono',monospace">£${val.toFixed(0)}</span>
          <span class="${g>=0?'positive':'negative'}" style="font-family:'IBM Plex Mono',monospace">${g>=0?'+':''}£${g.toFixed(0)}</span>
          <span class="${ret>=0?'positive':'negative'}" style="font-family:'IBM Plex Mono',monospace">${ret>=0?'+':''}${ret}%</span>
          <div><div style="font-size:11px;font-family:'IBM Plex Mono',monospace">${alloc}%</div><div class="alloc-bar-wrap" style="width:50px"><div class="alloc-bar-fill" style="width:${alloc}%;background:#48d597"></div></div></div>
          <span class="score-pill" style="background:${getScoreBg(score)};color:${getScoreColor(score)}">${score}</span>
        </div>`;
      }).join('')}
    </div>`;
}

function getSentSignalColor(sig) {
  if (sig==='STRONG BUY'||sig==='BUY') return '#48d597';
  if (sig==='STRONG SELL'||sig==='SELL') return '#f56565';
  return '#f6c90e';
}
function getSentSignalBg(sig) {
  if (sig==='STRONG BUY'||sig==='BUY') return '#0d2820';
  if (sig==='STRONG SELL'||sig==='SELL') return '#2a0a0a';
  return '#2a2000';
}

              }
            ]
          },

            maintainAspectRatio: false,

              legend: { display: false },

                backgroundColor: '#0d1117',
                borderColor: '#2a3441',
                borderWidth: 1,
                callbacks: {
                  afterLabel: (ctx) => {
                    const v = ctx.raw;
                    if (ctx.datasetIndex !== 0) return '';
                    if (v >= 1.5) return '→ STRONG BUY (Extreme Fear)';
                    if (v >= 1.1) return '→ BUY (Fearful crowd)';
                    if (v <= 0.5) return '→ STRONG SELL (Extreme Greed)';
                    if (v <= 0.7) return '→ SELL (Greedy crowd)';
                    return '→ NEUTRAL';
                  }
                }

              x: { ticks: { color: '#4a5568', font: { size: 10 } }, grid: { color: '#1e253033' } },

                grid: { color: '#1e253033' },
                min: 0,
                suggestedMax: 2,
              }
            }
          },
          plugins: [{
            // Draw shaded buy/sell zones
            id: 'zones',
            beforeDraw(chart) {
              const {ctx, chartArea: {top, bottom, left, right}, scales: {y}} = chart;
              if (!y) return;
              // Buy zone: P/C >= 1.1 (green band)
              const y11 = y.getPixelForValue(1.1);
              const yTop = y.getPixelForValue(y.max);
              ctx.save();
              ctx.fillStyle = 'rgba(72,213,151,0.08)';
              ctx.fillRect(left, Math.min(y11, yTop), right-left, Math.abs(y11-yTop));
              // Sell zone: P/C <= 0.7 (red band)
              const y07 = y.getPixelForValue(0.7);
              const yBot = y.getPixelForValue(y.min || 0);
              ctx.fillStyle = 'rgba(245,101,101,0.08)';
              ctx.fillRect(left, y07, right-left, Math.abs(yBot-y07));
              // Threshold lines
              ctx.strokeStyle = 'rgba(72,213,151,0.3)';
              ctx.setLineDash([4,4]);
              ctx.lineWidth = 1;
              ctx.beginPath(); ctx.moveTo(left, y11); ctx.lineTo(right, y11); ctx.stroke();
              ctx.strokeStyle = 'rgba(245,101,101,0.3)';
              ctx.beginPath(); ctx.moveTo(left, y07); ctx.lineTo(right, y07); ctx.stroke();
              ctx.restore();
            }
          }]
        });
        activeCharts.push(chart);
      }, 80);
    }

  } catch(e) {
    document.getElementById('sentResults').innerHTML = `<div class="error-box">⚠ Could not fetch options data for ${ticker}</div>`;

function setScanFilter(type, val) {
  _scannerFilter[type] = val;

  if (type === 'cat') {
    document.querySelectorAll('[id^="catBtn_"]').forEach(b => {
      const active = b.id === `catBtn_${val||'ALL'}`;
      b.style.background = active ? '#1a3a28' : '#161b22';
      b.style.borderColor = active ? '#48d597' : '#2a3441';
      b.style.color = active ? '#48d597' : '#718096';
    });
  } else {
    document.querySelectorAll('[id^="tierBtn_"]').forEach(b => {
      const active = b.id === `tierBtn_${val||'ALL'}`;
      b.style.background = active ? '#1a3a28' : '#161b22';
      b.style.borderColor = active ? '#48d597' : '#2a3441';
      b.style.color = active ? '#48d597' : '#718096';
    });
  }
  renderScanTable(_scannerData);

async function loadScanResults() {
  try {
    const params = new URLSearchParams();
    const data = await apiFetch('/api/scanner?' + params, {results:[], status:{}, scanned:0, total:0});
    _scannerData = data;

    // Update status bar
    const st  = data.status || {};
    const pct = data.total > 0 ? Math.round(data.scanned / data.total * 100) : 0;
    const statusEl = document.getElementById('scanStatus');
    if (statusEl) {
      const lastRun = st.last_run ? new Date(st.last_run*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '—';
      statusEl.innerHTML = `
        <div style="color:#48d597">${data.scanned} / ${data.total} scanned (${pct}%)</div>
        <div style="margin-top:2px">Current: <span style="color:#60a8ff">${st.current||'—'}</span></div>
        <div style="margin-top:2px">Last full scan: ${lastRun}</div>`;
    }

    renderScanTable(data);
  } catch(e) {
    console.error('Scanner fetch error', e);
  }
}

async function loadGMChart(economy, indicator) {
  const chartEl = document.getElementById('gmChartArea');
  if (!chartEl) return;
  chartEl.innerHTML = `<div class="loading-overlay" style="padding:30px"><div class="loading-spinner"></div><div class="loading-text">Fetching ${economy} ${indicator} data...</div></div>`;

  // Destroy any previous charts
  destroyCharts();

  try {
    let data, meta, latestVal, prevVal, change;

    if (economy === 'US') {
      const json = await apiFetch(`/api/macro/us?indicators=${indicator}&years=3`, {});
      const series = (json||{}).indicators?.[indicator];
      if (!series || !series.data?.length) {
        chartEl.innerHTML = `<div class="error-box">⚠ No data available for ${indicator}</div>`; return;
      }
      data     = series.data;
      meta     = GM_US_INDICATORS[indicator];
      latestVal = series.latest?.value;
      prevVal   = series.prev?.value;
    } else {
      const intlInd = { gdp_growth:'gdp_growth', inflation:'inflation', unemployment:'unemployment' }[indicator] || indicator;
      const json = await apiFetch(`/api/macro/international?countries=${economy}&indicators=${intlInd}&years=2`, {});
      const series = (json||{}).international?.[economy]?.[intlInd];
      if (!series || !series.data?.length) {
        chartEl.innerHTML = `<div class="error-box">⚠ No data available for ${economy} — World Bank data may have a lag of 1-2 years</div>`; return;
      }
      data      = series.data;
      meta      = GM_INTL_INDICATORS[intlInd];
      latestVal = series.latest?.value;
      prevVal   = series.prev?.value;
    }

    const eco    = GM_ECONOMIES[economy];
    const labels = data.map(d => d.date);
    const values = data.map(d => d.value);
    change       = latestVal && prevVal ? latestVal - prevVal : null;
    const chgCol = change === null ? '#718096' : change >= 0 ? '#f56565' : '#48d597'; // for inflation: rising = bad

    // Context label for latest reading
    const latestDate = data[data.length-1]?.date || '';

    chartEl.innerHTML = `
      <!-- Summary cards -->
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px">
        <div class="metric-card">
          <div class="metric-label">Latest Reading</div>
          <div class="metric-value" style="color:${eco.color}">${latestVal != null ? latestVal.toFixed(2) : '—'}${meta.unit === '%' ? '%' : ''}</div>
          <div class="metric-sub">${latestDate}</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Period Change</div>
          <div class="metric-value" style="color:${chgCol}">${change != null ? (change >= 0 ? '+' : '') + change.toFixed(2) + (meta.unit==='%'?'%':'') : '—'}</div>
          <div class="metric-sub">vs prior reading</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Data Points</div>
          <div class="metric-value">${data.length}</div>
          <div class="metric-sub">${meta.desc}</div>
        </div>
      </div>

      <!-- Chart -->
      <div style="position:relative;height:260px;margin-bottom:8px">
        <canvas id="gmLineChart"></canvas>
      </div>
      <div style="font-size:11px;color:#4a5568;text-align:right">
        Source: ${economy === 'US' ? 'Federal Reserve (FRED)' : 'World Bank'} · ${meta.label} · ${economy}
      </div>`;

    // Draw chart
    setTimeout(() => {
      const ctx = document.getElementById('gmLineChart');
      if (!ctx) return;

      // Shade recession-like zones if CPI > 3% or unemployment > 5%
      const threshold = meta.unit === '%' && indicator.includes('cpi') ? 3.0
                      : meta.unit === '%' && indicator.includes('unemployment') ? 5.0 : null;

      const chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: meta.label,
            data: values,
            borderColor: eco.color,
            backgroundColor: eco.color + '18',
            fill: true,
            borderWidth: 2.5,
            pointRadius: data.length > 60 ? 0 : 3,
            pointHoverRadius: 5,
            pointBackgroundColor: eco.color,
            tension: 0.35,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { intersect: false, mode: 'index' },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#0d1117',
              borderColor: '#2a3441',
              borderWidth: 1,
              titleColor: '#a0aec0',
              bodyColor: '#e2e8f0',
              callbacks: {
                label: ctx => ` ${ctx.parsed.y?.toFixed(2)}${meta.unit === '%' ? '%' : ''}  ${meta.label}`
              }
            }
          },
          scales: {
            x: {
              ticks: {
                color: '#4a5568',
                font: { size: 10 },
                maxTicksLimit: 12,
              },
              grid: { color: '#1e253022' }
            },
            y: {
              ticks: { color: '#4a5568', font: { size: 10 } },
              grid: { color: '#1e253033' },
            }
          }
        },
        plugins: [{
          id: 'thresholdZone',
          beforeDraw(chart) {
            if (!threshold) return;
            const { ctx, chartArea: { top, bottom, left, right }, scales: { y } } = chart;
            const threshY = y.getPixelForValue(threshold);
            ctx.save();
            ctx.fillStyle = 'rgba(245,101,101,0.06)';
            ctx.fillRect(left, top, right - left, Math.max(0, threshY - top));
            ctx.strokeStyle = 'rgba(245,101,101,0.3)';
            ctx.setLineDash([5, 4]);
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(left, threshY); ctx.lineTo(right, threshY); ctx.stroke();
            ctx.restore();
          }
        }]
      });
      activeCharts.push(chart);
    }, 80);

  } catch(e) {
    chartEl.innerHTML = `<div class="error-box">⚠ Failed to load data: ${e.message}</div>`;
  }
}

function setFxTimeframe(tf) {
  _fxTimeframe = tf;
  // Update button styles
  ['1D','1W','1M','3M'].forEach(t => {
    const btn = document.getElementById('fxTfBtn_' + t);
    if (!btn) return;
    const active = t === tf;
    btn.style.background   = active ? '#1a3a28' : '#161b22';
    btn.style.borderColor  = active ? '#48d597' : '#2a3441';
    btn.style.color        = active ? '#48d597' : '#718096';
  });
  // Re-render with new timeframe
  renderForex();
}

  el.innerHTML = `<div class="loading-overlay"><div class="loading-spinner"></div><div class="loading-text">Building your briefing...</div></div>`;

  // Fetch core data — macro first (fastest), others in background
  const wlParam = watchlist.slice(0,6).join(',');

  // Fetch all in parallel — apiFetch handles schema + errors gracefully
  const [macro, calData, newsData, scanner, wlQuotes] = await Promise.all([
    apiFetch('/api/macro',   {}),
    apiFetch('/api/calendar', {events:[]}),
    apiFetch('/api/news',     {news:[]}),
    apiFetch('/api/scanner',  {results:[]}),
    wlParam ? apiFetch('/api/quotes?tickers='+wlParam, []) : Promise.resolve([]),
  ]);

  // Cache watchlist quotes for use in signals panel
  (wlQuotes||[]).forEach(q => { if (q?.ticker) stockCache[q.ticker] = q; });

  const events = calData?.events || [];
  const news   = newsData?.news  || [];

  const sp500  = macro.sp500   || {};
  const vix    = macro.vix     || {};
  const gold   = macro.gold    || {};
  const bonds  = macro.bonds10 || {};
  const dxy    = macro.dxy     || {};
  const oil    = macro.oil     || {};

  // Market regime
  const vixLevel    = vix.price || 0;
  const spChg       = sp500.changePct || 0;
  const goldChg     = gold.changePct  || 0;
  // Regime: VIX + SPY + Gold together for a more robust signal
  const regimeLabel = vixLevel > 25 ? 'RISK-OFF'
                    : vixLevel > 18 ? 'CAUTIOUS'
                    : spChg > 0.3   ? 'RISK-ON'
                    : spChg < -0.3  ? 'CAUTIOUS'
                    : 'NEUTRAL';
  const regimeCol   = regimeLabel === 'RISK-ON' ? '#48d597' : regimeLabel === 'RISK-OFF' ? '#f56565' : '#f6c90e';
  const regimeBg    = regimeLabel === 'RISK-ON' ? '#0d2820' : regimeLabel === 'RISK-OFF' ? '#2a0a0a' : '#2a2000';

  // Today's high-impact events
  const todayStr    = now.toISOString().slice(0,10);
  const todayEvents = events.filter(e => e.date === todayStr && e.impact === 'HIGH');
  const upcomingEvents = events.filter(e => e.date > todayStr && e.impact === 'HIGH').slice(0,3);

  // Watchlist intel — stocks that need attention
  const wlSignals = watchlist.map(t => {
    const s = stockCache[t];
    if (!s) return null;
    const signals = [];
    if (s.changePct > 3)  signals.push({type:'move', msg: `+${s.changePct.toFixed(1)}% today`, col:'#48d597'});
    if (s.changePct < -3) signals.push({type:'move', msg: `${s.changePct.toFixed(1)}% today`, col:'#f56565'});
    if (s.price < s.fairValue * 0.9) signals.push({type:'value', msg: `${Math.round((1-s.price/s.fairValue)*100)}% below fair value`, col:'#48d597'});
    if (s.score >= 80) signals.push({type:'score', msg: `Score ${s.score} — strong fundamentals`, col:'#48d597'});
    return signals.length ? {ticker: t, name: s.name, price: s.price, changePct: s.changePct, signals, score: s.score, verdict: s.verdict} : null;
  }).filter(Boolean);

  // Top scanner opportunities
  const topOpps = (scanner.results || []).filter(r => r.tier === 'STRONG' || r.tier === 'WATCH').slice(0,4);

  const fmtP = n => {
    if (!n || n === 0) return '—';
    if (n >= 10000) return n.toLocaleString('en', {maximumFractionDigits:0});
    if (n >= 100)   return n.toFixed(1);
    return n.toFixed(2);
  };
  const cc   = n => (n||0) >= 0 ? '#48d597' : '#f56565';
  const arr  = n => (n||0) >= 0 ? '▲' : '▼';
  const impactCol = i => i==='HIGH'?'#f56565':i==='MEDIUM'?'#f6c90e':'#718096';

  el.innerHTML = `
    <!-- Date + Regime Header -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-size:13px;color:#4a5568;font-family:'IBM Plex Mono',monospace;margin-bottom:4px">${dateStr}</div>
        <div style="font-size:26px;font-weight:600;color:#e2e8f0">Good morning. Here's what matters today.</div>
      </div>
      <div style="background:${regimeBg};border:1px solid ${regimeCol}55;border-radius:10px;padding:12px 20px;text-align:center">
        <div style="font-size:10px;color:#4a5568;font-family:'IBM Plex Mono',monospace;letter-spacing:1px;margin-bottom:4px">MARKET REGIME</div>
        <div style="font-size:22px;font-weight:700;color:${regimeCol};font-family:'IBM Plex Mono',monospace">${regimeLabel}</div>
        <div style="font-size:11px;color:#4a5568;margin-top:3px">VIX ${fmtP(vixLevel)} · SPY ${spChg>=0?'+':''}${(spChg||0).toFixed(2)}%</div>
      </div>
    </div>

    <!-- Market Pulse Strip -->
    <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:18px">
      ${[
        ['SPY (S&P)', '$'+fmtP(sp500.price), sp500.changePct],
        ['VIX',       fmtP(vixLevel),        vix.changePct],
        ['GLD (Gold)','$'+fmtP(gold.price),  gold.changePct],
        ['USO (Oil)', '$'+fmtP(oil.price),   oil.changePct],
        ['TLT (Bond)','$'+fmtP(bonds.price), bonds.changePct],
        ['UUP (USD)', '$'+fmtP(dxy.price),   dxy.changePct],
      ].map(([n,v,c]) => `
        <div style="background:#0d1117;border:1px solid #1e2530;border-radius:7px;padding:10px 12px">
          <div style="font-size:10px;color:#4a5568;font-family:'IBM Plex Mono',monospace">${n}</div>
          <div style="font-size:15px;font-weight:600;color:#e2e8f0;font-family:'IBM Plex Mono',monospace;margin-top:3px">${v}</div>
          <div style="font-size:11px;color:${cc(c)};margin-top:2px">${arr(c)} ${Math.abs(c||0).toFixed(2)}%</div>
        </div>`).join('')}
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">

      <!-- Watchlist Signals -->
      <div class="panel">
        <div class="panel-title"><div class="panel-title-dot"></div>👁 Watchlist — Signals Today</div>
        ${wlSignals.length === 0 ? `
          <div style="text-align:center;padding:20px;color:#4a5568;font-size:13px">
            ${watchlist.length === 0
              ? 'Add stocks to your watchlist to see signals here'
              : stockCache[watchlist[0]]
                ? 'No significant signals on your watchlist today — markets quiet'
                : `<div style="margin-bottom:8px">Loading watchlist data...</div>
                   <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">
                     ${watchlist.slice(0,4).map(t => `<button onclick="loadTicker('${t}')" style="background:#161b22;border:1px solid #2a3441;color:#48d597;padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;font-family:'IBM Plex Mono',monospace">${t}</button>`).join('')}
                   </div>`}

          wlSignals.map(s => `
          <div onclick="document.getElementById('searchInput').value='${s.ticker}';showView('analysis');loadTicker('${s.ticker}')"

            <div style="flex:1">

                <span style="font-family:'IBM Plex Mono',monospace;font-weight:600;color:#e2e8f0">${s.ticker}</span>

              </div>
              <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:5px">
                ${s.signals.map(sig => `<span style="font-size:10px;color:${sig.col};background:${sig.col}18;border:1px solid ${sig.col}33;padding:1px 6px;border-radius:3px;font-family:'IBM Plex Mono',monospace">${sig.msg}</span>`).join('')}
              </div>
            </div>
            <div style="text-align:right;flex-shrink:0">
              <div style="font-family:'IBM Plex Mono',monospace;color:#e2e8f0">$${(s.price||0).toFixed(2)}</div>
              <div style="font-size:11px;color:${cc(s.changePct)}">${arr(s.changePct)} ${Math.abs(s.changePct||0).toFixed(2)}%</div>
            </div>
          </div>`).join('')}
        <div style="margin-top:8px">
          <button onclick="showView('watchlist')" style="width:100%;background:#0a0e1a;border:1px solid #1e2530;color:#4a5568;padding:8px;border-radius:6px;font-size:12px;cursor:pointer;transition:all .15s" onmouseover="this.style.borderColor='#48d597';this.style.color='#48d597'" onmouseout="this.style.borderColor='#1e2530';this.style.color='#4a5568'">
            View Full Watchlist →

        </div>
      </div>

      <!-- Today's Catalysts -->
      <div class="panel">
        <div class="panel-title"><div class="panel-title-dot"></div>📅 Catalysts — High Impact Events</div>
        ${todayEvents.length > 0 ? `
          <div style="margin-bottom:12px">
            <div style="font-size:10px;color:#f6c90e;font-family:'IBM Plex Mono',monospace;letter-spacing:1px;margin-bottom:8px">TODAY</div>
            ${todayEvents.map(e => `
              <div style="background:#2a2000;border:1px solid #4a3800;border-radius:6px;padding:9px 12px;margin-bottom:6px">
                <div style="display:flex;justify-content:space-between;align-items:center">
                  <span style="font-weight:600;color:#e2e8f0;font-size:13px">${e.event}</span>
                  <span style="font-size:10px;background:#4a3800;color:#f6c90e;padding:2px 7px;border-radius:3px;font-family:'IBM Plex Mono',monospace">${e.impact}</span>

                <div style="font-size:11px;color:#718096;margin-top:4px">Forecast: <span style="color:#f6c90e">${e.forecast||'—'}</span> · Previous: ${e.previous||'—'}
                  ${e.actual ? ` · Actual: <span style="color:${e.surprise==='BEAT'?'#48d597':'#f56565'}">${e.actual} ${e.surprise?'('+e.surprise+')':''}</span>` : ''}
                </div>
              </div>`).join('')}
          </div>` : `<div style="font-size:12px;color:#4a5568;margin-bottom:12px;padding:8px;background:#080c12;border-radius:6px">No high-impact releases scheduled for today</div>`}
        ${upcomingEvents.length > 0 ? `
          <div>
            <div style="font-size:10px;color:#4a5568;font-family:'IBM Plex Mono',monospace;letter-spacing:1px;margin-bottom:8px">UPCOMING</div>
            ${upcomingEvents.map(e => `
              <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #1e253033;font-size:12px">
                <div>
                  <span style="color:#a0aec0">${e.event}</span>
                  <span style="font-size:10px;color:${impactCol(e.impact)};margin-left:6px">${e.impact}</span>
                </div>
                <div style="text-align:right;font-family:'IBM Plex Mono',monospace;font-size:11px">
                  <div style="color:#4a5568">${e.date}</div>
                  <div style="color:#f6c90e">${e.forecast||'—'}</div>
                </div>
              </div>`).join('')}
          </div>` : ''}
        <div style="margin-top:10px">
          <button onclick="showView('macro')" style="width:100%;background:#0a0e1a;border:1px solid #1e2530;color:#4a5568;padding:8px;border-radius:6px;font-size:12px;cursor:pointer;transition:all .15s" onmouseover="this.style.borderColor='#48d597';this.style.color='#48d597'" onmouseout="this.style.borderColor='#1e2530';this.style.color='#4a5568'">
            Full Calendar & News →
          </button>
        </div>
      </div>
    </div>

    <!-- Top Opportunities from Scanner -->
    ${topOpps.length > 0 ? `
    <div class="panel" style="margin-bottom:14px">
      <div class="panel-title"><div class="panel-title-dot"></div>⚡ Opportunities Flagged — Scanner</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
        ${topOpps.map(o => {
          const tierCol = o.tier==='STRONG'?'#48d597':'#f6c90e';
          return `<div onclick="document.getElementById('searchInput').value='${o.ticker}';showView('analysis');loadTicker('${o.ticker}')"
                       style="background:#080c12;border:1px solid ${tierCol}33;border-radius:8px;padding:12px;cursor:pointer;transition:border-color .15s"
                       onmouseover="this.style.borderColor='${tierCol}88'" onmouseout="this.style.borderColor='${tierCol}33'">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
              <span style="font-family:'IBM Plex Mono',monospace;font-weight:600;color:#e2e8f0">${o.ticker}</span>
              <span style="font-size:10px;background:${tierCol}22;color:${tierCol};border:1px solid ${tierCol}44;padding:1px 6px;border-radius:3px;font-family:'IBM Plex Mono',monospace">${o.tier}</span>
            </div>
            <div style="font-size:11px;color:#718096;margin-bottom:6px">${o.displayName||o.name||''}</div>
            <div style="font-size:18px;font-weight:700;color:${tierCol};font-family:'IBM Plex Mono',monospace">${o.composite}</div>
            <div style="font-size:10px;color:#4a5568;margin-top:3px">${(o.flags||[]).slice(0,2).join(' · ')}</div>
          </div>`;
        }).join('')}
      </div>
      <button onclick="showView('scanner')" style="width:100%;margin-top:10px;background:#0a0e1a;border:1px solid #1e2530;color:#4a5568;padding:8px;border-radius:6px;font-size:12px;cursor:pointer;transition:all .15s" onmouseover="this.style.borderColor='#48d597';this.style.color='#48d597'" onmouseout="this.style.borderColor='#1e2530';this.style.color='#4a5568'">
        Full Opportunity Scanner →
      </button>
    </div>` : ''}

    <!-- News Strip -->
    ${news.length > 0 ? `
    <div class="panel">
      <div class="panel-title"><div class="panel-title-dot"></div>📰 Market-Moving News</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        ${news.slice(0,4).map(n => `
          <div onclick="window.open('${n.link||'#'}','_blank')" style="background:#080c12;border:1px solid #1e2530;border-radius:7px;padding:12px;cursor:pointer;transition:border-color .15s" onmouseover="this.style.borderColor='#2a3441'" onmouseout="this.style.borderColor='#1e2530'">
            <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
              ${n.impact?`<span style="font-size:9px;background:${n.impact==='HIGH'?'#2a0a0a':'#2a2000'};color:${n.impact==='HIGH'?'#f56565':'#f6c90e'};padding:1px 5px;border-radius:3px;font-family:'IBM Plex Mono',monospace">${n.impact}</span>`:''}
              ${n.sentiment?`<span style="font-size:9px;color:${n.sentiment==='Bullish'?'#48d597':n.sentiment==='Bearish'?'#f56565':'#718096'}">${n.sentiment}</span>`:''}
            </div>
            <div style="font-size:12px;font-weight:500;color:#e2e8f0;line-height:1.4">${n.title}</div>
          </div>`).join('')}
      </div>
    </div>` : ''}`;
}

// ══════════════════════════════════════════════════════════════════
// ◈ MARKETS HUB — Edge Finder style vertical signal ranker
// ══════════════════════════════════════════════════════════════════
let _marketsFilter = 'ALL';

async function renderMarkets() {
  const el = document.getElementById('mainContent');
  showSpinner('Scanning markets...');

  let data;
  try {
    data = await apiFetch('/api/markets', {});
  } catch(e) {
    showErr('Failed to load markets: ' + e.message); return;
  }
  if (!data || typeof data !== 'object') { showErr('Markets data unavailable — please try again.'); return; }

  // Flatten ALL assets into one list, sorted bullish → bearish
  let allAssets = [];
  try {
    allAssets = [
      ...(data.indices     || []),
      ...(data.commodities || []),
      ...(data.bonds       || []),
      ...(data.forex_etf   || []),
    ].sort((a,b) => (b.score||0) - (a.score||0));
  } catch(e) {
    showErr('Error processing market data: ' + e.message); return;
  }
  if (!allAssets.length) { showErr('No market data returned — try refreshing.'); return; }

  const classLabel = {
    indices:'INDEX', commodities:'COMMODITY', bonds:'BOND', forex_etf:'FOREX'
  };

  const macro  = data.macro || {};
  const regime = macro.regime || 'NEUTRAL';
  const regCol = regime==='RISK-ON'?'#48d597':regime==='RISK-OFF'?'#f56565':'#f6c90e';
  const regBg  = regime==='RISK-ON'?'#0d2820':regime==='RISK-OFF'?'#2a0a0a':'#1a1500';

  el.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-size:22px;font-weight:600;color:#e2e8f0">Market Scanner</div>
        <div style="font-size:12px;color:#4a5568;margin-top:3px">${allAssets.length} assets · Multi-factor scoring · Bullish top → Bearish bottom</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <!-- Regime pill -->
        <div style="background:${regBg};border:1px solid ${regCol}55;border-radius:6px;padding:5px 12px;font-size:11px;font-family:'IBM Plex Mono',monospace;color:${regCol}">
          REGIME: ${regime} · VIX ${(macro.vix||0).toFixed(1)} · SPY ${macro.sp_chg>=0?'+':''}${(macro.sp_chg||0).toFixed(2)}%
        </div>
        ${['ALL','INDEX','TECH','FINANCIALS','HEALTHCARE','CONSUMER','ENERGY','INDUSTRIALS','FTSE','GLOBAL','COMMODITY','BOND','FOREX','SECTOR'].map(f => `
          <button id="mktFilter_${f}" onclick="setMarketsFilter('${f}')"
            style="background:${f===_marketsFilter?'#1a3a28':'#161b22'};border:1px solid ${f===_marketsFilter?'#48d597':'#2a3441'};
                   color:${f===_marketsFilter?'#48d597':'#718096'};padding:4px 10px;border-radius:4px;font-size:11px;
                   cursor:pointer;font-family:'IBM Plex Mono',monospace">${f}
          </button>`).join('')}
        <button onclick="renderMarkets()" style="background:#161b22;border:1px solid #2a3441;color:#4a5568;padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;font-family:'IBM Plex Mono',monospace">↻</button>
      </div>
    </div>

    <!-- Factor legend -->
    <div style="display:flex;gap:12px;margin-bottom:14px;padding:8px 12px;background:#080c12;border-radius:6px;font-size:10px;color:#4a5568;flex-wrap:wrap">
      <span><span style="color:#48d597">INDEX</span> uses: range + momentum + regime + regional GDP + inflation</span>
      <span>·</span>
      <span><span style="color:#f6c90e">COMMODITY</span> uses: range + momentum + USD strength + inflation + regime</span>
      <span>·</span>
      <span><span style="color:#c084fc">BOND</span> uses: range + momentum + yield direction + inflation + regime</span>
      <span>·</span>
      <span><span style="color:#fb923c">FOREX</span> uses: range + momentum + rate differential + econ health</span>
    </div>

    <!-- Main ranked list -->
    <div id="mktRankedList">Loading...</div>`;

  // Render list separately with error catch
  try {
    document.getElementById('mktRankedList').innerHTML = renderMarketsList(allAssets, classLabel);
  } catch(e) {
    document.getElementById('mktRankedList').innerHTML = '<div style="color:#f56565;padding:20px">Render error: ' + e.message + '</div>';
    console.error('renderMarketsList error:', e);
  }
  // prevent double-render
  return;
  // dummy to close template
  el.innerHTML += '';
}

function renderMarketsList(allAssets, classLabel) {
  const classLabel2 = classLabel || {
    indices:'INDEX', commodities:'COMMODITY', bonds:'BOND', forex_etf:'FOREX'
  };

  const filterMap = {
    'ALL':null, 'INDEX':'indices', 'TECH':'tech', 'FINANCIALS':'financials',
    'HEALTHCARE':'healthcare', 'CONSUMER':'consumer', 'ENERGY':'energy',
    'INDUSTRIALS':'industrials', 'FTSE':'ftse100', 'GLOBAL':'global',
    'COMMODITY':'commodities', 'BOND':'bonds', 'FOREX':'forex_etf',
    'SECTOR':'sector_etfs',
  };
  const filterClass = filterMap[_marketsFilter];
  const filtered = !filterClass
    ? allAssets
    : allAssets.filter(a => a.assetClass === filterClass);

  if (!filtered.length) return '<div style="text-align:center;padding:40px;color:#4a5568">No assets match this filter</div>';

  const scoreCol  = s => s >= 3 ? '#48d597' : s <= -3 ? '#f56565' : '#718096';
  const scoreBg   = s => s >= 72 ? '#0d2820' : s >= 55 ? '#1a1500' : '#2a0a0a';
  const chgCol    = v => v >= 0.3 ? '#48d597' : v <= -0.3 ? '#f56565' : '#718096';
  const fmtChg    = v => (v>=0?'+':'')+v.toFixed(2)+'%';
  const fmtP      = v => v >= 1000 ? '$'+v.toLocaleString('en',{maximumFractionDigits:0}) : '$'+v.toFixed(2);
  const assetCols = {INDEX:'#60a8ff', COMMODITY:'#f6c90e', BOND:'#c084fc', FOREX:'#fb923c'};

  // Dividers between tiers
  let prevTier = null;
  const rows = [];

  filtered.forEach((item, i) => {
    const score   = item.score || 50;
    const normScore = Math.abs(score) > 10 ? Math.round((score - 50) / 5) : score;
    const tier      = normScore >= 3 ? 'BULLISH' : normScore <= -3 ? 'BEARISH' : 'NEUTRAL';
    const label   = classLabel2[item.assetClass] || 'ASSET';
    const labelCol= assetCols[label] || '#718096';

    // Insert tier divider
    if (tier !== prevTier) {
      const divCol = tier === 'BULLISH' ? '#48d597' : tier === 'NEUTRAL' ? '#f6c90e' : '#f56565';
      const divBg  = tier === 'BULLISH' ? '#0d2820' : tier === 'NEUTRAL' ? '#1a1500' : '#2a0a0a';
      rows.push(`
        <div style="display:flex;align-items:center;gap:10px;margin:${prevTier?'8px':'0'} 0 6px">
          <div style="height:1px;background:${divCol}33;flex:1"></div>
          <div style="font-size:10px;font-weight:700;color:${divCol};font-family:'IBM Plex Mono',monospace;
                      background:${divBg};border:1px solid ${divCol}44;padding:2px 10px;border-radius:10px;letter-spacing:1px">
            ${tier === 'BULLISH' ? '▲ BULLISH' : tier === 'NEUTRAL' ? '— NEUTRAL' : '▼ BEARISH'}
          </div>
          <div style="height:1px;background:${divCol}33;flex:1"></div>
        </div>`);
      prevTier = tier;
    }

    // -10 to +10 bar — extends from centre
    // Positive = green right, Negative = red left, Zero = neutral grey
    const barCol    = normScore >= 3 ? '#48d597' : normScore <= -3 ? '#f56565' : '#718096';
    // normScore already declared above
    const barPct    = Math.min(50, Math.abs(normScore) / 10 * 50);
    const barLeft   = normScore >= 0 ? 50 : (50 - barPct);
    const scoreNum  = normScore >= 3
